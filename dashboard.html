<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoL Live — Corridor Dashboard</title>
<!-- ============================================================================
     SoL Live — SINGLE-FILE corridor dashboard with an in-browser Anubis solver.
     No browser extension, no Node server. Everything (PoW solver + SoL scraper +
     dashboard) lives in this one file.

     ── WHY IT NEEDS A SPECIAL LAUNCH ──────────────────────────────────────────
     SoL (sol5.metapensiero.it) serves plain HTML with NO CORS headers, so a
     normal browser page may not READ cross-origin responses — it can't even see
     the Anubis challenge to solve it. A plain .html file has no privilege that
     gets around that, so you must launch a THROWAWAY Chromium with web security
     disabled:

       Linux:
         google-chrome --disable-web-security --user-data-dir="/tmp/sol-dash" \
           "file:///ABS/PATH/dashboard.html?url=https://sol5.metapensiero.it/lit/tourney/<GUID>"

       macOS:
         "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
           --disable-web-security --user-data-dir="/tmp/sol-dash" \
           "file:///ABS/PATH/dashboard.html?url=https://sol5.metapensiero.it/lit/tourney/<GUID>"

       Windows:
         chrome.exe --disable-web-security --user-data-dir="%TEMP%\sol-dash" ^
           "file:///C:/ABS/PATH/dashboard.html?url=https://sol5.metapensiero.it/lit/tourney/<GUID>"

     NOTES:
       • --user-data-dir is REQUIRED: Chrome ignores --disable-web-security on your
         normal profile. Use a fresh disposable dir.
       • Firefox has NO equivalent flag — use Chrome / Chromium / Edge / Brave.
       • Configure the target via the ?url= query param (above), or by editing
         CONFIG.targetUrl below. With neither, the page asks for the URL on screen.
         Also supported: ?poll=<sec>&rounds=<N>&idt=<id>.
       • COOKIE: after solving, Anubis sets `techaro.lol-anubis-auth`. Verified live
         (2026-07) that SoL issues it as SameSite=None; Secure, so it DOES ride
         along on our cross-site fetches under --disable-web-security — no extra
         setup. (If a future Anubis config ever downgrades it to SameSite=Lax/Strict
         you'd loop on "Anubis challenge — retrying…"; the fix would be a Chrome
         enterprise policy LegacySameSiteCookieBehaviorEnabledForDomainList =
         ["metapensiero.it"], or a tiny same-origin local proxy.)
       • VERIFIED end-to-end against the live 28th Eurocup Singles page: solver
         cleared Anubis, 146 players parsed and rendered, zero JS errors.
     ============================================================================ -->
<style>
/* ============================================================
   Carrom Tournament Corridor Dashboard — PoC
   Light / neutral theme, projector-first, responsive.
   Design cues borrowed from eurocup.carrom.cz:
     navy header (#0b4e93), blue accents (#0d7ff2/#275a88),
     orange (#ff4100/#FF9C00) and green (#00BD39).
   No build, no CDN — runs offline from file://.
   ============================================================ */
:root{
  --navy:#0b4e93;
  --navy-2:#0a3f78;
  --blue:#0d7ff2;
  --blue-ink:#275a88;
  --sky:#63aefb;
  --orange:#ff4100;
  --amber:#ff9c00;
  --green:#00bd39;
  --ink:#14233a;
  --muted:#5b6b80;
  --line:#dfe6ef;
  --panel:#ffffff;
  --bg:#eef2f7;
  --gold:#e8b00a;
  --silver:#9aa7b4;
  --bronze:#c47a36;
  --shadow:0 1px 3px rgba(16,40,80,.10),0 6px 18px rgba(16,40,80,.06);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  display:flex;flex-direction:column;height:100vh;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ---------- Header ---------- */
header.app{
  background:linear-gradient(180deg,var(--navy),var(--navy-2));
  color:#fff;display:flex;align-items:center;gap:clamp(.6rem,1.5vw,1.2rem);
  padding:clamp(.5rem,1.4vw,1rem) clamp(.8rem,2vw,1.6rem);
}
header.app .logo{flex:0 0 auto;width:clamp(34px,4.2vw,56px);height:clamp(34px,4.2vw,56px);display:block;object-fit:contain}
header.app .title{display:flex;flex-direction:column;line-height:1.1;min-width:0}
header.app .event{
  font-size:clamp(1.05rem,2.4vw,2rem);font-weight:800;letter-spacing:.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
header.app .sub{
  font-size:clamp(.7rem,1.3vw,1rem);color:#cfe0f5;font-weight:600;
  text-transform:uppercase;letter-spacing:.08em;margin-top:.15rem;
}
header.app .sub .dot{opacity:.55;margin:0 .45em}

/* The logo opens the settings panel. A gear badge fades in on hover so the control is
   discoverable to whoever is standing at the machine, while an unattended corridor
   screen (no pointer over it) shows nothing but the logo. The wrapper is what carries
   the click, so it works for both the host <img> and the bundled <svg> fallback. */
header.app .logowrap{position:relative;flex:0 0 auto;line-height:0;cursor:pointer}
header.app .logowrap .gear{
  position:absolute;right:-3px;bottom:-3px;
  width:1.3em;height:1.3em;display:flex;align-items:center;justify-content:center;
  font-size:clamp(11px,1.1vw,15px);line-height:1;border-radius:50%;
  background:#0a3f78;color:#fff;border:1px solid rgba(255,255,255,.55);
  opacity:0;transition:opacity .12s linear;pointer-events:none;
}
header.app .logowrap:hover .gear{opacity:1}

/* ---------- Message bar (announcement to players; click the logo to edit) ---------- */
#messageBar{
  display:none;text-align:center;white-space:pre-wrap;
  font-size:clamp(1.3rem,2.4vw,2rem);font-weight:600;line-height:1.35;
  color:#6b4a00;background:linear-gradient(180deg,#fff8e1,#fdf0c6);
  border-bottom:2px solid #f0c74a;
  padding:clamp(.4rem,1vw,.75rem) clamp(.8rem,2vw,1.6rem);
}
#messageBar.on{display:block}
#messageBar::before{content:"📢";margin-right:.6em}
/* The clock's next-round block and the "Round n / N" subtitle stay clickable, but as
   shortcuts into the one settings panel rather than dialogs of their own. */
header.app .aux{cursor:pointer}
header.app .sub{cursor:pointer}

/* ---------- Timer bar ---------- */
.timerbar{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;
  gap:clamp(.6rem,2vw,2rem);
  padding:clamp(.5rem,1.4vw,1rem) clamp(.8rem,2vw,1.6rem);
  background:#fff;border-bottom:1px solid var(--line);box-shadow:var(--shadow);
}
.timerbar .round{
  font-size:clamp(.95rem,1.8vw,1.5rem);font-weight:800;color:var(--blue-ink);
  white-space:nowrap;
}
.timerbar .round small{display:block;font-size:.6em;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.timerbar .clock{text-align:center;line-height:1}
.timerbar .clock .time{
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  font-size:clamp(2.4rem,8vw,5.5rem);font-weight:800;letter-spacing:.01em;
  font-variant-numeric:tabular-nums;
}
.timerbar .clock .state{
  font-size:clamp(.7rem,1.5vw,1.15rem);font-weight:800;text-transform:uppercase;
  letter-spacing:.1em;margin-top:.1rem;
}
.timerbar .aux{text-align:right;font-weight:700;color:var(--muted);white-space:nowrap}
.timerbar .aux .nrlabel{display:block;font-size:clamp(.62rem,1.1vw,.95rem);text-transform:uppercase;letter-spacing:.1em}
.timerbar .aux b{display:block;color:var(--blue-ink);font-size:clamp(1.4rem,3.2vw,2.4rem);font-variant-numeric:tabular-nums;line-height:1.05}

/* clock states */
.state-running .time{color:var(--ink)}
.state-running .state{color:var(--green)}
/* step-end keeps these looping animations discrete (value holds between keyframes),
   so the compositor only produces a frame when the value flips (~2/s) instead of
   repainting/swapping every vsync (60/s). Smooth interpolation here pins ~1 CPU core. */
.state-prealarm{animation:pulsebg 1.6s step-end infinite}
.state-prealarm .time{color:var(--orange)}
.state-prealarm .state{color:var(--orange)}
.state-time .time{color:var(--orange)}
.state-time .state{color:var(--orange)}
.state-ended .time,.state-ended .state{color:#e00516}
.state-ended{animation:pulsebg-red 1.6s step-end infinite}
@keyframes pulsebg-red{0%,100%{background:#fff}50%{background:#ffe1e1}}
.state-next .time{color:var(--blue-ink)}
.state-next .state{color:var(--blue-ink)}
@keyframes pulsebg{0%,100%{background:#fff}50%{background:#fff4e6}}
.statedot{display:inline-block;width:.7em;height:.7em;border-radius:50%;background:currentColor;margin-right:.4em;vertical-align:baseline}

/* ---------- Panels ---------- */
main{
  flex:1 1 auto;display:grid;grid-template-columns:1fr 1fr;
  gap:clamp(.6rem,1.4vw,1.1rem);padding:clamp(.6rem,1.4vw,1.1rem);min-height:0;
}
.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;overflow:hidden;
}
.panel > h2{
  margin:0;padding:clamp(.5rem,1.2vw,.85rem) clamp(.7rem,1.4vw,1.1rem);
  font-size:clamp(.95rem,1.8vw,1.5rem);font-weight:800;color:#fff;
  background:var(--blue-ink);display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;
}
.panel > h2 .pginfo{font-size:.62em;font-weight:700;color:#cfe0f5;letter-spacing:.05em;margin-left:auto}
/* round marker next to the Standings title — same font as the header's eventSub */
.panel > h2 .roundmark{
  font-size:clamp(.7rem,1.3vw,1rem);color:#cfe0f5;font-weight:600;
  text-transform:uppercase;letter-spacing:.08em;
}
.panel .body{padding:0 clamp(.3rem,.8vw,.6rem) clamp(.3rem,.8vw,.6rem);overflow:hidden;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.panel .body::-webkit-scrollbar{width:0;height:0}
/* Auto-scroll: fixed header stays in .body; rows live in .scroller, moved via GPU transform inside the clipping .sclip */
.panel .body .sclip{flex:1 1 auto;min-height:0;overflow:hidden;position:relative}
.panel .body .scroller{will-change:transform}
/* Multi-column standings (full width, no matches): pinned header row + column-major body.
   padding-right keeps the last column's numbers off the panel edge (they'd otherwise clip). */
.panel .body .scol-head,.panel .body .scol-grid{display:grid;gap:0 clamp(.7rem,1.8vw,1.6rem);padding-right:clamp(.35rem,.9vw,.7rem)}
.panel .body .scol-grid{align-items:start}

/* ---------- Match rows ---------- */
.match{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;
  gap:clamp(.4rem,1vw,.9rem);
  padding:clamp(.35rem,.9vw,.7rem) clamp(.4rem,1vw,.7rem);
  border-bottom:1px solid var(--line);
}
.match:last-child{border-bottom:0}
.match .board{
  flex:0 0 auto;min-width:2.2em;text-align:center;
  font-weight:800;color:#fff;background:var(--blue);border-radius:8px;
  padding:.18em .35em;font-size:clamp(.8rem,1.5vw,1.2rem);
}
.match .sides{min-width:0;display:flex;flex-direction:column;gap:.15em}
.match .side{
  display:flex;justify-content:space-between;gap:.5rem;align-items:baseline;
  font-size:clamp(.85rem,1.6vw,1.35rem);line-height:1.15;
}
.match .side .names{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.match .side .sc{
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  font-weight:800;font-variant-numeric:tabular-nums;min-width:1.6em;text-align:right;color:var(--muted);
}
.match .side.win .names{color:var(--green)}
.match .side.win .sc{color:var(--green)}
.match .badges{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2em;min-width:2.2em}
.badge{
  font-size:clamp(.6rem,1.1vw,.85rem);font-weight:800;text-transform:uppercase;
  letter-spacing:.05em;padding:.12em .45em;border-radius:999px;white-space:nowrap;min-width:1.7em;display:inline-flex;align-items:center;justify-content:center;line-height:1;
}
.badge.fin{background:#e3f8ea;color:#067a2a}
.badge.live{background:#fff0db;color:#a85e00}
.badge.live .statedot{width:.55em;height:.55em;animation:blink 1.2s step-end infinite}
.badge.bye{background:#eef1f5;color:var(--muted)}
.badge .statedot{margin:0}
/* Eased cosine "breathing" pulse held in discrete steps (see step-end note above):
   16 opacity levels read as a smooth fade but emit ~14 frames/s instead of 60 — ~4x
   cheaper on a weak integrated GPU, where a truly smooth pulse costs ~1 CPU core.
   (Add/remove stops to trade smoothness vs frame rate.) */
@keyframes blink{
  0%,100%{opacity:1}  6.25%{opacity:.97} 12.5%{opacity:.89} 18.75%{opacity:.77}
  25%{opacity:.62}   31.25%{opacity:.48} 37.5%{opacity:.36} 43.75%{opacity:.28}
  50%{opacity:.25}   56.25%{opacity:.28} 62.5%{opacity:.36} 68.75%{opacity:.48}
  75%{opacity:.62}   81.25%{opacity:.77} 87.5%{opacity:.89} 93.75%{opacity:.97}
}

/* ---------- Standings ---------- */
table.rank{width:100%;border-collapse:collapse;table-layout:fixed;font-size:clamp(.85rem,1.6vw,1.35rem)}
/* fixed layout + shared colgroup keep the pinned header table aligned with the scrolling body table */
/* cg-r is wide enough for a right-aligned 3-digit rank chip (100+ players) to sit inside it
   without overflowing, so every chip's right edge lines up and the gap to the name is constant */
table.rank col.cg-r{width:3.9rem}
table.rank col.cg-pts{width:2.8rem}
table.rank col.cg-num{width:2.6rem}
table.rank th{
  text-align:right;font-size:.7em;text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted);font-weight:800;padding:.2em .5em;border-bottom:2px solid var(--line);
  background:var(--panel);
}
table.rank th.name{text-align:left}
table.rank td{padding:clamp(.28rem,.7vw,.55rem) .5em;border-bottom:1px solid var(--line);text-align:right}
table.rank td.name{text-align:left;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.rank td.r{text-align:right;padding-left:.15em}
table.rank td.pts{font-weight:800;color:var(--blue-ink);font-variant-numeric:tabular-nums}
table.rank td.num{font-variant-numeric:tabular-nums;color:var(--muted)}
.rankchip{
  display:inline-block;min-width:1.2em;padding:.12em .34em;border-radius:7px;text-align:center;
  font-weight:800;color:#fff;background:var(--blue-ink);font-variant-numeric:tabular-nums;
}
.rankchip.r1{background:var(--gold)}
.rankchip.r2{background:var(--silver)}
.rankchip.r3{background:var(--bronze)}

/* ---------- Footer ---------- */
footer.app{
  position:relative;
  display:flex;flex-wrap:wrap;gap:clamp(.5rem,2vw,1.5rem);align-items:center;
  padding:clamp(.4rem,1vw,.7rem) clamp(.8rem,2vw,1.6rem);
  background:#0a3f78;color:#cfe0f5;font-size:clamp(.72rem,1.3vw,1rem);font-weight:600;
}
footer.app .live{color:#fff;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
/* Connection state, driven by applyStatus. The dot was permanently green, which claimed
   a working SoL connection while the page was still waiting for its first poll, or had
   just failed one. Blink stays step-end everywhere — see the performance note. */
footer.app .live .statedot{background:currentColor;animation:blink 1.6s step-end infinite}
footer.app .live.ok{color:#fff}
footer.app .live.ok .statedot{background:var(--green)}
footer.app .live.warn{color:var(--amber)}
footer.app .live.warn .statedot{background:var(--amber);animation:blink .9s step-end infinite}
/* Offline holds steady: a dead connection that keeps pulsing reads as activity. */
footer.app .live.err{color:var(--orange)}
footer.app .live.err .statedot{background:var(--orange);animation:none}
/* Nothing configured to poll — the URL prompt is up, so there is no connection to report. */
footer.app .live.off{display:none}
footer.app .src{margin-left:auto;opacity:.75}

/* Zoom control — centred in the footer, revealed only on hover so the corridor
   screen (which never has a pointer on it) shows nothing. Absolutely positioned
   so it centres on the footer itself, independent of the flex items around it. */
.zoomctl{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:flex;align-items:center;gap:.5em;
  opacity:0;pointer-events:none;transition:opacity .12s linear;
}
footer.app:hover .zoomctl,.zoomctl:focus-within{opacity:1;pointer-events:auto}
.zoomctl button{
  font:inherit;line-height:1;cursor:pointer;padding:0;
  color:#fff;background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.35);border-radius:999px;
}
.zoomctl button:hover{background:rgba(255,255,255,.24)}
.zoomctl .zbtn{width:2em;height:2em;font-weight:800;font-size:1.05em}
.zoomctl .pct{
  min-width:4em;height:2em;font-weight:700;font-variant-numeric:tabular-nums;
  background:none;border-color:transparent;
}

/* ---------- Responsive: stack on phones ---------- */
@media (max-width:780px){
  body{height:auto;overflow:auto}
  main{grid-template-columns:1fr}
  .timerbar{grid-template-columns:1fr;text-align:center;gap:.3rem}
  .timerbar .round,.timerbar .aux{text-align:center}
  header.app .event{white-space:normal}
}

/* ---- Clock moved into the top header bar ---- */
header.app{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:clamp(.5rem,1.5vw,1.2rem)}
header.app .brand{display:flex;align-items:center;gap:clamp(.6rem,1.5vw,1.2rem);min-width:0}
header.app .clockbox{justify-self:center;text-align:center;line-height:1.05}
header.app .clockbox .time{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(1.7rem,4.8vw,3.2rem);font-weight:800;font-variant-numeric:tabular-nums;color:#fff}
header.app .clockbox .state{font-size:clamp(.6rem,1.2vw,.95rem);font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#cfe0f5}
header.app .aux{grid-column:3;justify-self:end;text-align:right;color:#cfe0f5;font-weight:700;white-space:nowrap}
header.app .aux .nrlabel{display:block;font-size:clamp(.55rem,1vw,.8rem);text-transform:uppercase;letter-spacing:.08em;opacity:.85}
header.app .aux b{display:block;font-size:clamp(1rem,2.2vw,1.6rem);font-variant-numeric:tabular-nums}

/* ---- QR code to the live SoL page: floating, flush in the bottom-right
   corner (over the footer bar and a corner of the standings panel). Only
   useful early on (rounds 1-2); auto-hidden from round 3, click to dismiss
   any time. ---- */
.qrbox{
  display:none;position:fixed;right:0;bottom:0;z-index:5;cursor:pointer;
  flex-direction:column;align-items:center;gap:.3rem;
  background:#fff;border-radius:10px 0 0 0;padding:8px 10px;box-shadow:0 2px 10px rgba(16,40,80,.25);
}
.qrbox.show{display:flex}
.qrbox .qrlabel{
  font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--blue-ink);
}
.qrbox .qrimg{width:clamp(90px,10vw,130px);height:clamp(90px,10vw,130px)}
.qrbox .qrimg svg{display:block;width:100%;height:100%}
/* Clock state colors on the navy header. Scoped under header.app so they outrank
   `header.app .clockbox .time/.state` (same specificity → later wins); without the
   prefix the white/pale-blue defaults would swallow these. Running keeps the default
   (white time, pale-blue label); only prealarm/ended/next recolor. */
header.app .state-prealarm .time,header.app .state-prealarm .state{color:#ffb84d}
header.app .state-ended .time,header.app .state-ended .state{color:#ff6b6b}
header.app .state-next .time,header.app .state-next .state{color:#cfe0f5}
.state-prealarm,.state-ended{animation:none}
/* blink only while the clock still runs but every board is final; once the
   round is over the clock sits steady red */
.state-alldone .time,.state-alldone .state{animation:textpulse 1.2s step-end infinite}
@keyframes textpulse{0%,100%{opacity:1}50%{opacity:.45}}
/* ---- Live matches column header ---- */
.match.head{position:sticky;top:0;background:var(--panel);z-index:2;border-bottom:2px solid var(--line)}
.match.head .board{background:none;color:var(--muted);font-weight:800;padding:0 .2em;font-size:.72em;text-transform:uppercase;letter-spacing:.05em;text-align:left}
.match.head .side{font-size:.72em;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800}
.match.head .side .sc{color:var(--muted)}

/* ---- Two-column live matches ---- */
#matchesBody .mhead{background:var(--panel);display:grid;border-bottom:2px solid var(--line)}
#matchesBody .mgrid{display:grid}
#matchesBody .mcol{min-width:0;border-right:1px solid var(--line)}
#matchesBody .mcol:last-child{border-right:0}
#matchesBody .mcol .match{border-bottom:1px solid var(--line)}
#matchesBody .mhead .match.head{position:static;border-bottom:0;background:none;border-right:1px solid var(--line)}
#matchesBody .mhead .match.head:last-child{border-right:0}

/* ===== Large-format overrides (rem-based → scale with browser zoom) ===== */
html{font-size:20px}
header.app .event{font-size:2rem}
header.app .sub{font-size:1.1rem}
header.app .clockbox .time{font-size:3.6rem}
header.app .clockbox .state{font-size:1.15rem}
header.app .aux .nrlabel{font-size:.95rem}
header.app .aux b{font-size:1.9rem}
.panel>h2{font-size:1.55rem}
.panel>h2 .pginfo{font-size:1rem}
table.rank{font-size:1.35rem}
table.rank th{font-size:1.1rem;color:var(--blue-ink)}
/* BCH/NET headers at this font-size need more room than the base 2.6rem col, or they collide */
table.rank col.cg-num{width:3.4rem}
/* 3-digit ranks (100+) need more room than the base 2.4rem col, or the chip overlaps the name */
table.rank col.cg-r{width:4rem}
.rankchip{font-size:1.15rem}
.match .side{font-size:1.3rem}
.match .board{font-size:1.15rem}
.badge{font-size:1rem}
.mhead .match.head .board,.mhead .match.head .side{font-size:1.1rem;color:var(--blue-ink)}
/* surname = bold caps, first name = regular */
.sn{font-weight:800;text-transform:uppercase}
.match .side .names{font-weight:400}
table.rank td.name{font-weight:400}
.vs{opacity:.45;font-weight:400;margin:0 .25em}


/* Doubles: long slash-joined names must shrink & ellipsize inside narrow columns */
.match .side .names{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== Finals (best-of-N) panel ===== */
.finals{display:flex;flex-direction:column;gap:1.1rem;padding:1.1rem}
.final-match{border:2px solid var(--gold);border-radius:16px;padding:1.1rem 1.3rem;
  background:linear-gradient(180deg,rgba(232,176,10,.10),rgba(232,176,10,0))}
.final-match.top{border-width:3px}
.final-match.decided{background:linear-gradient(180deg,rgba(0,189,57,.12),rgba(0,189,57,0));border-color:var(--green)}
.final-match .frank{font-size:.95rem;font-weight:800;text-transform:uppercase;letter-spacing:.09em;
  color:var(--gold);margin-bottom:.6rem}
.final-match.decided .frank{color:var(--green)}
/* Teams stacked vertically around the series score — centred, full-width lines so long
   doubles names don't collide with the score (they ellipsize only in the extreme). */
.final-match .fteams{display:flex;flex-direction:column;align-items:center;gap:.35rem;text-align:center}
.final-match .fteam{font-size:1.6rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.final-match .fteam.win{color:var(--green)}
.final-match .fteam .crown{font-size:1.1rem;margin-left:.35rem}
.final-match .fseries{font-size:2.6rem;font-weight:800;color:var(--muted);white-space:nowrap;
  font-variant-numeric:tabular-nums;line-height:1.05}
.final-match .fseries .win{color:var(--green)}
.final-match .fseries .dash{margin:0 .35rem;opacity:.45}
.final-match .fgames{display:flex;gap:.9rem;margin-top:1.1rem}
.final-match .fgame{flex:1 1 0;min-width:0;border:1px solid var(--line);border-radius:12px;padding:.7rem .5rem;
  text-align:center;background:var(--panel)}
.final-match .fgame.pending{opacity:.4}
.final-match .fgame.live{border-color:var(--green);box-shadow:0 0 0 2px rgba(0,189,57,.22)}
.final-match .fgame .fgl{font-size:.82rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);margin-bottom:.35rem;display:flex;align-items:center;justify-content:center;gap:.35rem}
.final-match .fgame .fgs{font-size:2rem;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.final-match .fgame .fgs .sep{margin:0 .3rem;opacity:.4}
.final-match .fgame.awin .fgs .a,.final-match .fgame.bwin .fgs .b{color:var(--green)}
</style>

<!-- Settings panel styles, kept in their own block because this block's text is copied
     verbatim into the detached settings window, which has no other stylesheet. Every
     rule is therefore scoped to .sset and carries its own custom properties and font
     stack, and sizes in em off .sset's own 16px base — the panel must NOT ride the
     dashboard's zoomed rem base, or zooming the screen would resize the operator's
     controls along with it. -->
<style id="setCss">
#settingsOverlay{position:fixed;inset:0;background:rgba(11,30,51,.55);display:none;align-items:center;justify-content:center;z-index:60}
#settingsOverlay.on{display:flex}
/* Startup prompt for the tournament URL, shown when none is configured. Below the
   settings overlay so Space can still open settings on top of it. */
#urlPrompt{position:fixed;inset:0;background:rgba(11,30,51,.55);display:none;align-items:center;justify-content:center;z-index:55}
#urlPrompt.on{display:flex}
#urlPrompt .sset{box-shadow:0 12px 40px rgba(0,0,0,.35)}
#urlPrompt .row{justify-content:flex-end}
.sset{
  --s-line:#dfe6ef;--s-ink:#14233a;--s-muted:#5b6b80;--s-blue:#0d7ff2;--s-blue-ink:#275a88;
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--s-ink);background:#fff;border-radius:12px;
  padding:1.2em 1.4em;width:min(92vw,32em);display:flex;flex-direction:column;gap:.85em;
}
#settingsOverlay .sset{box-shadow:0 12px 40px rgba(0,0,0,.35)}
/* In the detached window the panel IS the page, so it fills whatever width the window
   has instead of holding a fixed 32em that would overflow into a scrollbar. */
body>.sset{width:auto;border-radius:0}
.sset h3{margin:0;font-size:1.15em;color:var(--s-blue-ink)}
.sset .hint{margin:-.5em 0 0;font-size:.8em;font-weight:400;color:var(--s-muted)}
.sset label{display:flex;align-items:center;justify-content:space-between;gap:.8em;font-weight:600}
.sset label.col{flex-direction:column;align-items:stretch;gap:.35em}
.sset textarea{font:inherit;padding:.6em;border:1px solid var(--s-line);border-radius:8px;resize:vertical;min-height:4.5em}
.sset input[type=time],.sset input[type=number],.sset select{font:inherit;padding:.35em .5em;border:1px solid var(--s-line);border-radius:8px;background:#fff;color:inherit}
.sset input[type=url]{font:inherit;padding:.6em;border:1px solid var(--s-line);border-radius:8px;background:#fff;color:inherit;width:100%;box-sizing:border-box}
.sset select{max-width:60%}
/* Club names are long ("European Carrom Confederation") — a stacked label gives the
   option text the full panel width instead of ellipsizing it. */
.sset label.col select{max-width:none;width:100%}
.sset input[type=number]{width:5.5em}
.sset input[type=checkbox]{width:1.15em;height:1.15em}
.sset .zrow{display:flex;align-items:center;gap:.5em}
.sset .zrow output{min-width:3.6em;text-align:center;font-variant-numeric:tabular-nums}
.sset .zrow button{width:2em;height:2em;padding:0;font-weight:800}
.sset #setColsPct{cursor:pointer}
.sset hr{border:0;border-top:1px solid var(--s-line);margin:.1em 0;width:100%}
.sset .row{display:flex;align-items:center;gap:.6em;margin-top:.2em}
.sset .row .note{margin-right:auto;font-size:.85em;font-weight:700;color:#00bd39;opacity:0;transition:opacity .12s linear}
.sset .row .note.on{opacity:1}
.sset button{font:inherit;font-weight:700;padding:.45em 1.1em;border-radius:8px;border:1px solid var(--s-line);background:#f2f5f9;color:var(--s-ink);cursor:pointer}
.sset button:hover{background:#e7ecf3}
.sset button.primary{background:var(--s-blue);border-color:var(--s-blue);color:#fff}
.sset button.primary:hover{background:#0b6fd6}
</style>
</head>
<body>
<header class="app">
  <div class="brand">
    <div class="logowrap" id="logoBtn" title="Dashboard settings">
    <img class="logo" id="logoImg" alt="" style="display:none">
    <svg class="logo" id="logoFallback" viewBox="0 0 64 64" role="img" aria-label="Carrom">
      <rect x="3" y="3" width="58" height="58" rx="9" fill="#ffffff" opacity=".12"/>
      <rect x="12" y="12" width="40" height="40" rx="4" fill="none" stroke="#ffffff" stroke-width="2.5"/>
      <circle cx="32" cy="32" r="8.5" fill="none" stroke="#ffffff" stroke-width="2.5"/>
      <circle cx="32" cy="32" r="2.6" fill="#ff9c00"/>
      <circle cx="16" cy="16" r="3" fill="#ffffff"/><circle cx="48" cy="16" r="3" fill="#ffffff"/>
      <circle cx="16" cy="48" r="3" fill="#ffffff"/><circle cx="48" cy="48" r="3" fill="#ffffff"/>
    </svg>
    <span class="gear" aria-hidden="true">⚙</span>
    </div>
    <div class="title">
      <span class="event" id="eventName">SoL Live</span>
      <span class="sub" id="eventSub"></span>
    </div>
  </div>
  <div class="clockbox" id="timerbar">
    <div class="time" id="clockTime">--:--</div>
    <div class="state" id="clockState"></div>
  </div>
  <div class="aux" id="clockAux"></div>
</header>

<div id="messageBar"></div>

<main>
  <section class="panel" id="matchesPanel">
    <h2><span id="matchesTitle">Live matches</span><span class="pginfo" id="matchesPg"></span></h2>
    <div class="body" id="matchesBody"></div>
  </section>
  <section class="panel" id="standingsPanel">
    <h2><span id="standingsTitle">Standings</span><span class="roundmark" id="standingsRound"></span><span class="pginfo" id="standingsPg"></span></h2>
    <div class="body" id="standingsBody"></div>
  </section>
</main>

<footer class="app">
  <span class="live warn" id="connbadge"><span class="statedot"></span><span id="conntext">Connecting</span></span>
  <span id="updated"></span>
  <div class="zoomctl">
    <button type="button" class="zbtn" id="zoomOut" title="Zoom out (−)">−</button>
    <button type="button" class="pct" id="zoomPct" title="Reset zoom to 100% (0)">100%</button>
    <button type="button" class="zbtn" id="zoomIn" title="Zoom in (+)">+</button>
  </div>
  <span class="src" id="dashstatus"></span>
</footer>

<!-- Settings form. Lives in a <template> because the same markup is cloned into either
     the detached settings window or the #settingsOverlay fallback below. -->
<template id="settingsTpl">
  <div class="sset">
    <h3>Dashboard settings</h3>
    <label class="col">Message to players
      <textarea id="setMsg" rows="3" placeholder="Shown below the header — leave empty to hide the bar"></textarea>
    </label>
    <hr>
    <label>Next round start <input type="time" id="setNext"></label>
    <p class="hint" id="setNextHint"></p>
    <label>Break between rounds (min) <input type="number" id="setBreak" min="0" max="180" step="5"></label>
    <label>Total rounds <input type="number" id="setRounds" min="1" max="99" step="1"></label>
    <p class="hint">Empty hides the “/ N” part of “Round n / N”.</p>
    <hr>
    <label>Screen zoom
      <span class="zrow">
        <button type="button" id="setZoomOut" title="Zoom out">−</button>
        <output id="setZoomPct">100%</output>
        <button type="button" id="setZoomIn" title="Zoom in">+</button>
      </span>
    </label>
    <label>Columns
      <span class="zrow">
        <button type="button" id="setColsOut" title="Fewer columns">−</button>
        <output id="setColsPct" title="Click to reset to automatic">Auto</output>
        <button type="button" id="setColsIn" title="More columns">+</button>
      </span>
    </label>
    <label>Show QR code <input type="checkbox" id="setQr"></label>
    <label class="col">Header emblem
      <select id="setEmblem">
        <option value="host">Hosting club</option>
        <option value="owner">Championship owner</option>
        <option value="off">None — board icon</option>
      </select>
    </label>
    <p class="hint" id="setEmblemHint"></p>
    <div class="row">
      <span class="note" id="setNote">Applied ✓</span>
      <button type="button" id="setClose">Close</button>
      <button type="button" id="setApply" class="primary">Apply</button>
    </div>
  </div>
</template>

<!-- Fallback host for the settings form when the detached window is blocked. -->
<div id="settingsOverlay"></div>

<!-- Startup prompt when no tournament URL is configured (no ?url= and an empty
     CONFIG.targetUrl) — for operators who don't speak query strings. Submitting
     reloads the page with ?url= set, so the address bar ends up exactly as if it
     had been typed, and the result can be bookmarked. -->
<div id="urlPrompt">
  <form class="sset" id="urlForm">
    <h3>SoL Live Dashboard</h3>
    <label class="col">Tournament page URL
      <input type="url" id="urlInput" required spellcheck="false"
             placeholder="https://sol5.metapensiero.it/lit/tourney/…">
    </label>
    <p class="hint">Open your tournament's public page on SoL and paste its address here.
      It lands in this page's address bar, so you can bookmark the result to skip this step.</p>
    <div class="row">
      <button type="submit" class="primary">Show the tournament</button>
    </div>
  </form>
</div>

<div class="qrbox" id="qrBox" title="Click to hide">
  <div class="qrlabel">Results</div>
  <div class="qrimg" id="qrImg"></div>
</div>

<!-- Vendored QR encoder (MIT, Kazuhiko Arase) — inlined so this file stays a
     single self-contained page with no CDN/network dependency. -->
<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];

  qrcode.stringToBytesFuncs['UTF-8'] = function(s) {
    // http://stackoverflow.com/questions/18729405/how-to-convert-utf8-string-to-byte-array
    function toUTF8Array(str) {
      var utf8 = [];
      for (var i=0; i < str.length; i++) {
        var charcode = str.charCodeAt(i);
        if (charcode < 0x80) utf8.push(charcode);
        else if (charcode < 0x800) {
          utf8.push(0xc0 | (charcode >> 6),
              0x80 | (charcode & 0x3f));
        }
        else if (charcode < 0xd800 || charcode >= 0xe000) {
          utf8.push(0xe0 | (charcode >> 12),
              0x80 | ((charcode>>6) & 0x3f),
              0x80 | (charcode & 0x3f));
        }
        // surrogate pair
        else {
          i++;
          // UTF-16 encodes 0x10000-0x10FFFF by
          // subtracting 0x10000 and splitting the
          // 20 bits of 0x0-0xFFFFF into two halves
          charcode = 0x10000 + (((charcode & 0x3ff)<<10)
            | (str.charCodeAt(i) & 0x3ff));
          utf8.push(0xf0 | (charcode >>18),
              0x80 | ((charcode>>12) & 0x3f),
              0x80 | ((charcode>>6) & 0x3f),

    return toUTF8Array(s);

    return qrcode;
