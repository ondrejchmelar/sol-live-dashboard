// ---------------------------------------------------------------------
// Vendored default: use UTF-8 byte encoding (URLs are plain ASCII here,
// but this keeps behavior correct if a tourney URL ever carries non-Latin
// text). Equivalent to upstream's optional qrcode_UTF8.js add-on.
// ---------------------------------------------------------------------
qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
</script>

<script>
"use strict";
/* ============================================================================
   CONFIG — edit here, or override with URL query params:
     ?url=<lit tourney URL>&poll=<seconds>&rounds=<N>&idt=<idtourney>&qr=0&logo=<url>
   ============================================================================ */
const Q = new URLSearchParams(location.search);
const CONFIG = {
  // The public SoL "lit" tournament page: /lit/tourney/<guid>. Left empty, boot shows
  // an on-screen prompt for it instead of polling — bake a URL here (README option B)
  // to skip both the query param and the prompt.
  targetUrl: Q.get("url") || "",
  pollSeconds: Number(Q.get("poll")) || 60,
  // Swiss events don't expose a target round count — shown as "Round n / N".
  totalRounds: Q.get("rounds") ? Number(Q.get("rounds")) : 8,
  // Optional manual countdown id (normally auto-detected while the clock runs).
  idtourney: Q.get("idt") || "",
  // QR code to the live page, floating bottom-right. Auto-hidden from round 3
  // on; &qr=1 forces it on regardless of round, &qr=0 forces it off entirely.
  qrForceOn: Q.get("qr") === "1",
  qrForceOff: Q.get("qr") === "0",
  // Logo of the association actually hosting the event (any URL — runs with
  // --disable-web-security anyway). Overrides the emblem auto-detected from SoL;
  // both fall back to the bundled board icon when unset or if the image fails.
  hostLogoUrl: Q.get("logo") || "",
};

/* Header logo, in priority order: &logo= override, then a club emblem auto-detected
   from SoL (see resolveEmblem), then the bundled board icon.

   Resolved emblems are cached per tournament URL so a previous tournament's club can't
   leak into a new one (same rule as the learned idtourney). BOTH clubs are resolved —
   `host` is the "Hosted by" organiser, `owner` the championship's club — so switching
   between them is instant and never re-fetches. Each is {src,title} or null. */
const EMBLEM_KEY = "solDash.emblem";
let EMBLEM = { url: null, host: null, owner: null, tried: false };
try {
  const e = JSON.parse(localStorage.getItem(EMBLEM_KEY) || "null");
  // Shape check, not just a URL match: an entry cached by an older build has {src,title}
  // and no host/owner, and its `tried` flag would make resolveEmblem skip forever —
  // leaving the header stuck on the board icon. Discard anything that isn't this shape.
  if (e && e.url === CONFIG.targetUrl && ("host" in e || "owner" in e)) EMBLEM = e;
} catch (e) {}

/* One setting drives the header emblem: which club, or none. "off" matters because SoL
   accepts whatever image a club uploaded — some are BMPs or odd aspect ratios that look
   wrong blown up on a 4K header — so the operator needs a way out without relaunching.
   Default "host": the association actually running the event is normally the one that
   belongs on its own venue screen. */
const EMBLEM_MODE_KEY = "solDash.emblemMode";
const EMBLEM_MODES = ["host", "owner", "off"];
let EMBLEM_MODE = "host";
try {
  const v = localStorage.getItem(EMBLEM_MODE_KEY);
  if (EMBLEM_MODES.includes(v)) EMBLEM_MODE = v;
} catch (e) {}

// The chosen club, falling back to the other one when the choice has no emblem —
// better the other club's badge than a placeholder board.
function emblemPick(){
  if (EMBLEM_MODE === "off") return null;
  const first = EMBLEM_MODE === "owner" ? EMBLEM.owner : EMBLEM.host;
  return first || EMBLEM.owner || EMBLEM.host || null;
}

function setEmblemMode(mode){
  EMBLEM_MODE = EMBLEM_MODES.includes(mode) ? mode : "host";
  try { localStorage.setItem(EMBLEM_MODE_KEY, EMBLEM_MODE); } catch (e) {}
  applyLogo();
}

let logoAppliedSrc = null;
function applyLogo(){
  const img = document.getElementById("logoImg");
  const fallback = document.getElementById("logoFallback");
  const em = emblemPick();
  const wanted = CONFIG.hostLogoUrl || (em && em.src) || null;
  img.alt = em && wanted === em.src ? (em.title || "") : "";
  if (!wanted) {
    img.style.display = "none"; fallback.style.display = ""; logoAppliedSrc = null;
    return;
  }
  if (wanted === logoAppliedSrc) return;
  img.onerror = () => {
    if (logoAppliedSrc !== null) { img.onerror = null; img.style.display = "none"; fallback.style.display = ""; logoAppliedSrc = null; }
  };
  img.src = wanted;
  img.style.display = "";
  fallback.style.display = "none";
  logoAppliedSrc = wanted;
}
applyLogo();

/* ============================================================================
   1) ANUBIS proof-of-work solver (runs entirely in this page).
   Protocol (TecharoHQ/anubis): the interstitial embeds
     <script id="anubis_challenge" type="application/json">
       {"challenge":{"id":"…","randomData":"…"},"rules":{"algorithm":"…","difficulty":N}}
   Solve: find nonce s.t. sha256hex(randomData + nonce) starts with `difficulty`
   leading '0' hex chars. Then GET
     /.within.website/x/cmd/anubis/api/pass-challenge?id=&response=<hash>&nonce=&redir=&elapsedTime=
   which sets the `techaro.lol-anubis-auth` cookie (~7-day life) and 302→redir.
   ============================================================================ */
const ANUBIS_API = "/.within.website/x/cmd/anubis/api";

function toHex(buf){
  const a = new Uint8Array(buf);
  let s = "";
  for (let i = 0; i < a.length; i++) s += a[i].toString(16).padStart(2, "0");
  return s;
}

// Batched native SHA-256 so the loop is fast AND yields to keep the UI alive.
async function solvePoW(randomData, difficulty){
  if (!(self.crypto && self.crypto.subtle))
    throw new Error("crypto.subtle unavailable (needs a secure context; file:// works in Chrome)");
  const prefix = "0".repeat(Math.max(1, difficulty | 0));
  const enc = new TextEncoder();
  const t0 = performance.now();
  const BATCH = 512;
  let nonce = 0;
  for (;;){
    const jobs = [];
    for (let i = 0; i < BATCH; i++){
      const n = nonce + i;
      jobs.push(crypto.subtle.digest("SHA-256", enc.encode(randomData + n)).then((b) => toHex(b)));
    }
    const hashes = await Promise.all(jobs); // resolves in array (= nonce) order
    for (let i = 0; i < hashes.length; i++){
      if (hashes[i].startsWith(prefix)) return { hash: hashes[i], nonce: nonce + i, elapsed: performance.now() - t0 };
    }
    nonce += BATCH;
    if (nonce > 100000000) throw new Error("PoW exceeded 100M iterations — difficulty too high?");
  }
}

const pathOf = (u) => { const x = new URL(u); return x.pathname + x.search; };

// Given the interstitial HTML, solve it and hit pass-challenge. Returns true on success.
async function solveAnubis(interstitialHtml, targetUrl){
  const doc = new DOMParser().parseFromString(interstitialHtml, "text/html");

  // Primary path: embedded challenge JSON + proof of work.
  const el = doc.querySelector("#anubis_challenge");
  if (el && el.textContent && el.textContent.trim()){
    let j = null;
    try { j = JSON.parse(el.textContent); } catch (e) { j = null; }
    if (j && j.challenge && j.rules){
      const difficulty = Number(j.rules.difficulty) || 1;
      logStatus("Solving Anubis proof-of-work (difficulty " + difficulty + ")…");
      const { hash, nonce, elapsed } = await solvePoW(j.challenge.randomData, difficulty);
      const u = new URL(ANUBIS_API + "/pass-challenge", targetUrl);
      u.searchParams.set("id", j.challenge.id);
      u.searchParams.set("response", hash);
      u.searchParams.set("nonce", String(nonce));
      u.searchParams.set("redir", pathOf(targetUrl));
      u.searchParams.set("elapsedTime", String(Math.round(elapsed)));
      const r = await fetch(u.href, { credentials: "include", redirect: "follow", cache: "no-store" });
      return r.ok || r.redirected;
    }
  }

  // Fallback: a meta-refresh interstitial (metarefresh challenge) — just follow it.
  const meta = doc.querySelector('meta[http-equiv="refresh" i]');
  if (meta){
    const m = /url=(.+)$/i.exec(meta.getAttribute("content") || "");
    if (m){
      const dest = new URL(m[1].trim().replace(/^['"]|['"]$/g, ""), targetUrl);
      const r = await fetch(dest.href, { credentials: "include", redirect: "follow", cache: "no-store" });
      return r.ok || r.redirected;
    }
  }
  return false;
}

/* ============================================================================
   2) FETCH — credentialed, no-store; heuristically detect the Anubis gate.
   ============================================================================ */
const ANUBIS_MARKERS = [/anubis/i, /making sure you[’'`]?re not a bot/i, /proof[- ]of[- ]work/i, /not a bot/i];

async function fetchTarget(url){
  const started = performance.now();
  const resp = await fetch(url, {
    credentials: "include",
    redirect: "follow",
    cache: "no-store", // countdown/turn URLs repeat every round — never serve a stale clock/score
    headers: { Accept: "text/html,application/xhtml+xml" },
  });
  const html = await resp.text();
  const elapsedMs = Math.round(performance.now() - started);
  const anubis = ANUBIS_MARKERS.some((re) => re.test(html.slice(0, 4000))) && !/<table/i.test(html);
  return {
    ok: resp.ok, httpStatus: resp.status, html, anubis,
    contentType: resp.headers.get("content-type") || "", bytes: html.length,
    elapsedMs, redirected: resp.redirected, finalUrl: resp.url,
  };
}

// Fetch, and if the Anubis challenge is returned, solve it in-page then re-fetch.
async function fetchWithSolve(url){
  let r = await fetchTarget(url);
  if (r.anubis){
    if (!everRendered) showEmpty({ state: "anubis", message: "Re-solving the Anubis challenge…" });
    applyStatus({ state: "anubis", message: "Solving the Anubis challenge…" });
    try {
      const solved = await solveAnubis(r.html, url);
      if (solved) r = await fetchTarget(url);
    } catch (e) {
      console.warn("[anubis] solve failed:", e);
    }
  }
  return r;
}

/* ============================================================================
   3) PARSERS — SoL's lit HTML via the browser's DOMParser.
   ============================================================================ */
function parseTourney(html){
  const doc = new DOMParser().parseFromString(html, "text/html");
  const tablesFound = doc.querySelectorAll("table").length;

  if (isAnubis(doc)) return emptyTourney("anubis", "", tablesFound);

  const tournament = cleanText(doc.querySelector("h1.title, h1, title")?.textContent) || "Tournament";
  const table = doc.querySelector("table.ranking") || pickRankingTable(doc);
  const details = parseDetails(doc);
  const idtourney = extractIdTourney(doc);
  const preCountdown = extractPreCountdown(doc);
  const currentTurn = detectCurrentTurn(doc);
  const final = parseFinalInfo(doc);
  const emblem = parseEmblem(doc);

  if (!table){
    // Before the first round there is no ranking table yet — still surface the prep timer.
    const t = emptyTourney("empty", tournament, tablesFound);
    t.idtourney = idtourney;
    t.preCountdown = preCountdown;
    t.currentTurn = currentTurn;
    t.details = details;
    t.final = final;
    t.emblem = emblem;
    return t;
  }

  const headers = readHeaders(table);
  const rankIndex = findHeader(headers, ["#", "rank", "pos", "place"], 0);
  const playerIndex = findHeader(headers, ["team", "player", "name", "competitor"], 1);
  const prized =
    headers.map(normalize).some((h) => /prize|premio|prijs|preis/.test(h)) ||
    !!table.querySelector("td.total, th.total");

  const bodyRows = [...table.querySelectorAll("tbody tr")];
  const rows = bodyRows.length ? bodyRows : [...table.querySelectorAll("tr")].slice(1);
  const standings = rows
    .map((tr, i) => {
      const cells = [...tr.querySelectorAll("td, th")].map((c) => cleanText(c.textContent));
      if (!cells.length) return null;
      const rank = num(cells[rankIndex]);
      return { rank: rank != null ? rank : i + 1, player: cells[playerIndex] || "", cells };
    })
    .filter(Boolean);

  const playerHdr = String(headers[playerIndex] || "").toLowerCase();
  const type = /team|doubl|pair|čtyř|ctyr/.test(playerHdr) ? "doubles" : "singles";

  return {
    status: "ok", tournament, type, currentTurn,
    totalRounds: null, prized, idtourney, preCountdown, final, emblem, headers, rankIndex, playerIndex, details, standings,
    _diag: { tablesFound, rowsParsed: standings.length, idtourney, currentTurn, prized, type, final },
  };
}

// SoL's matches_row() (lit/tourney.mako) renders each match as TWO <tr>: the first
// carries the board/rank cell (rowspan=2) plus competitor1 — its name and its score
// share the class "competitor1" (name cell has the <a>, score cell is "right aligned").
// The second <tr> mirrors that for competitor2, or is a lone ".phantom" pair on a bye.
// A running/not-yet-started match shows the live partial score, flagged by
// "partial-score" on the score cell (not on the <tr> — only the training-boards
// layout still does that).
function extractMatchSide(row, cls){
  if (!row) return { name: "", score: "", partial: false };
  const cells = [...row.querySelectorAll("." + cls)];
  if (!cells.length) return { name: "", score: "", partial: false };
  const nameCell = cells.find((c) => c.querySelector("a")) || cells[0];
  const scoreCell = cells.find((c) => c !== nameCell) || nameCell;
  return {
    name: cleanText(nameCell.textContent),
    score: cleanText(scoreCell.textContent),
    partial: scoreCell.classList.contains("partial-score"),
  };
}

function parseMatches(html){
  const doc = new DOMParser().parseFromString(html, "text/html");
  if (isAnubis(doc)) return [];

  const table = doc.querySelector("table.matches") || doc.querySelector("table.boards");
  if (!table) return [];

  const bodyRows = [...table.querySelectorAll("tbody tr")];
  const rows = bodyRows.length ? bodyRows : [...table.querySelectorAll("tr")].slice(1);

  const matches = [];
  for (let i = 0; i < rows.length; i += 2){
    const r1 = rows[i];
    const r2 = rows[i + 1] || null;

    const side1 = extractMatchSide(r1, "competitor1");
    const phantomCells = r2 ? [...r2.querySelectorAll(".phantom")] : [];
    const side2 = phantomCells.length
      ? { name: "", score: cleanText(phantomCells[phantomCells.length - 1].textContent), partial: false }
      : extractMatchSide(r2, "competitor2");

    const c1 = side1.name;
    const c2 = side2.name;
    if (!c1 && !c2) continue;

    const rankCell = r1.querySelector(".rank");
    const board = num(rankCell ? cleanText(rankCell.textContent) : "") ?? (i / 2 + 1);
    const n1 = num(side1.score);
    const n2 = num(side2.score);
    const isPartial = side1.partial || side2.partial;
    const hasScores = n1 != null && n2 != null;
    const finished = !isPartial && hasScores;
    const phantom = /phantom|^—|\bbye\b/i.test(c1 + " " + c2) || !c1 || !c2;
    matches.push({
      board,
      side1: splitNamesParse(c1),
      side2: splitNamesParse(c2),
      score1: n1 != null ? n1 : 0,
      score2: n2 != null ? n2 : 0,
      finished,
      winner: finished ? (n1 > n2 ? 1 : n2 > n1 ? 2 : 0) : 0,
      phantom,
    });
  }
  return matches;
}

function pickRankingTable(doc){
  const tables = [...doc.querySelectorAll("table")];
  let best = null, bestScore = -1;
  for (const t of tables){
    const head = (t.querySelector("tr")?.textContent || "").toLowerCase();
    let score = t.querySelectorAll("tr").length;
    if (/team|player|name|competitor/.test(head)) score += 100;
    if (/pts|points|score|net/.test(head)) score += 100;
    if (score > bestScore){ bestScore = score; best = t; }
  }
  return best;
}

function readHeaders(table){
  const headRow = table.querySelector("thead tr") || table.querySelector("tr");
  return headRow ? [...headRow.querySelectorAll("th, td")].map((c) => cleanText(c.textContent)) : [];
}

function findHeader(headers, keys, fallback){
  const norm = headers.map(normalize);
  for (const k of keys){ const i = norm.indexOf(k); if (i !== -1) return i; }
  return fallback;
}

function detectCurrentTurn(doc){
  const black = doc.querySelector('a.black[href*="turn="], a.button.black[href*="turn="]');
  if (black){ const m = black.getAttribute("href").match(/turn=(\d+)/); if (m) return Number(m[1]); }
  let max = null;
  for (const a of doc.querySelectorAll('a[href*="turn="]')){
    const m = a.getAttribute("href").match(/turn=(\d+)/);
    if (m){ const n = Number(m[1]); if (max == null || n > max) max = n; }
  }
  return max;
}

function extractIdTourney(doc){
  const a = doc.querySelector('a[href*="idtourney="]') || doc.querySelector('a[href*="countdown"]');
  if (a){ const m = (a.getAttribute("href") || "").match(/idtourney=(\d+)/); if (m) return m[1]; }
  return null;
}

// While a round is being prepared, the tourney page links to the pre-round timer:
//   /tourney/pre_countdown?idtourney=…&duration=<min>&prealarm=<min>
// That page has NO server anchor (new PreCountdown(dur, pre) starts at page load), so we
// read duration/prealarm from this link and anchor the countdown locally in poll().
function extractPreCountdown(doc){
  const a = doc.querySelector('a[href*="pre_countdown"]');
  if (!a) return null;
  const href = a.getAttribute("href") || "";
  const dm = href.match(/[?&]duration=([\d.]+)/);
  if (!dm) return null;
  const pm = href.match(/[?&]prealarm=([\d.]+)/);
  return { durationMin: parseFloat(dm[1]), prealarmMin: pm ? parseFloat(pm[1]) : 0 };
}

function parseDetails(doc){
  const out = {};
  for (const t of doc.querySelectorAll("table.definition")){
    for (const tr of t.querySelectorAll("tr")){
      const tds = tr.querySelectorAll("td");
      if (tds.length >= 2){
        const k = normalize(tds[0].textContent);
        const v = cleanText(tds[1].textContent);
        if (k && v && !out[k]) out[k] = v;
      }
    }
  }
  return out;
}

/* Club emblem sources on a tourney page. SoL tracks TWO clubs and the details table
   names both: "Club" owns the championship, "Hosted by" is the club actually running
   the event. The <img id="emblem"> on the tourney page is the *championship owner's* —
   verified against the live Eurocup 2026 page, which shows the European Carrom
   Confederation while the organiser is the Czech Carrom Association. So collect the
   links to both club pages (each carries its own #emblem) plus whatever the tourney
   page itself shows, and let resolveEmblem() prefer the host. */
function parseEmblem(doc){
  const out = { hostedByHref: "", hostedByName: "", clubHref: "", clubName: "", pageSrc: "", pageTitle: "" };
  for (const t of doc.querySelectorAll("table.definition")){
    for (const tr of t.querySelectorAll("tr")){
      const tds = tr.querySelectorAll("td");
      if (tds.length < 2) continue;
      const k = normalize(tds[0].textContent);          // "Hosted by" -> "hostedby"
      const a = tds[1].querySelector("a[href]");
      if (!a) continue;
      if (k === "hostedby" && !out.hostedByHref){
        out.hostedByHref = a.getAttribute("href");
        out.hostedByName = cleanText(a.textContent);
      } else if (k === "club" && !out.clubHref){
        out.clubHref = a.getAttribute("href");
        out.clubName = cleanText(a.textContent);
      }
    }
  }
  const img = doc.querySelector("#emblem, #club_emblem img");
  if (img){
    out.pageSrc = img.getAttribute("src") || "";
    out.pageTitle = cleanText(img.getAttribute("title"));
  }
  return out;
}

// The "Final" definition row (present once a final is configured) tells us the final
// kind and where it starts, e.g.:
//   <td>Final</td><td><a href="…?turn=6">1st/2nd place, Best of three games</a></td>
// We read: the raw text, the number of games (best-of-N → N, single game → 1), and the
// first final turn from the link. Returns null when there is no final configured.
function parseFinalInfo(doc){
  for (const t of doc.querySelectorAll("table.definition")){
    for (const tr of t.querySelectorAll("tr")){
      const tds = tr.querySelectorAll("td");
      if (tds.length >= 2 && normalize(tds[0].textContent) === "final"){
        const text = cleanText(tds[1].textContent);
        const a = tds[1].querySelector('a[href*="turn="]');
        let firstTurn = null;
        if (a){ const m = (a.getAttribute("href") || "").match(/turn=(\d+)/); if (m) firstTurn = Number(m[1]); }
        // The kind is the last comma-separated segment ("… , Best of three games").
        const kindLabel = text.split(",").pop().trim() || text;
        return { text, kindLabel, firstTurn, games: bestOfCount(kindLabel) };
      }
    }
  }
  return null;
}
// "Best of three games" → 3; "Best of 5 games" → 5; anything else (single game) → 1.
function bestOfCount(text){
  const m = /best of\s+([\w]+)/i.exec(text || "");
  if (!m) return 1;
  const words = { one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, nine: 9 };
  const w = m[1].toLowerCase();
  return words[w] || Number(w) || 1;
}

function isAnubis(doc){
  const t = (doc.title + " " + (doc.body?.textContent || "")).slice(0, 2000).toLowerCase();
  return /anubis|not a bot|proof[- ]of[- ]work/.test(t) && !doc.querySelector("table");
}

function emptyTourney(status, tournament, tablesFound){
  return {
    status, tournament, type: "singles", currentTurn: null, totalRounds: null,
    prized: false, idtourney: null, preCountdown: null, final: null, headers: [], rankIndex: 0, playerIndex: 1,
    details: {}, standings: [], _diag: { tablesFound },
  };
}

function splitNamesParse(name){
  return String(name || "").split(/\s+and\s+|\s*\/\s*|\s*&\s*/i).map((s) => s.trim()).filter(Boolean);
}
function normalize(s){ return String(s || "").toLowerCase().replace(/[^a-z0-9+#/]/g, "").trim(); }
function cleanText(s){ return String(s || "").replace(/\s+/g, " ").trim(); }
function num(s){
  if (s == null || s === "") return null;
  const n = parseFloat(String(s).replace(",", ".").replace(/[^\d.+-]/g, ""));
  return Number.isFinite(n) ? n : null;
}

/* ============================================================================
   4) COUNTDOWN parser — the running-round clock at /tourney/countdown.
   (The pre-round PreCountdown is handled separately via the page's pre_countdown
   link — see extractPreCountdown/poll — since that page carries no server anchor.)
   ============================================================================ */
function parseCountdown(html){
  const m = html.match(/new\s+Countdown\(\s*['"][^'"]*['"]\s*,\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*(false|[\d.]+)/i);
  if (!m) return null;
  const durationMin = parseFloat(m[1]);
  const prealarmMin = parseFloat(m[2]);
  const elapsedMs = m[3] === "false" ? null : parseFloat(m[3]); // 4th arg is MILLISECONDS
  if (elapsedMs == null){
    return { mode: "ready", durationMin, prealarmMin, startedAtISO: null, elapsedSec: null };
  }
  const startedAtISO = new Date(Date.now() - elapsedMs).toISOString();
  const over = elapsedMs >= durationMin * 60 * 1000;
  return { mode: over ? "over" : "running", durationMin, prealarmMin, startedAtISO, elapsedSec: Math.round(elapsedMs / 1000) };
}

/* ============================================================================
   4b) buildFinals — assemble a best-of-N final from its per-game turns.
   Each final game lives on its own SoL turn (firstTurn, firstTurn+1, …). SoL only
   creates the next game's turn once the previous one is played, so `gameTurns` holds
   just the games that exist so far; the rest render as "pending". Boards are grouped
   into pairings (1st/2nd, 3rd/4th, …) by the set of player names, which is stable even
   when SoL swaps who breaks between games. A/B orientation is fixed from the first game.
   ============================================================================ */
function buildFinals(rank, gameTurns){
  const games = rank.final.games;
  const firstTurn = rank.final.firstTurn;
  const nameKey = (arr) => (arr || []).map((s) => s.toLowerCase()).sort().join("|");
  const boardKey = (b) => [...(b.side1 || []), ...(b.side2 || [])].map((s) => s.toLowerCase()).sort().join("|");

  const byKey = new Map();
  for (const gt of gameTurns){
    for (const b of gt.matches){
      if (b.phantom) continue;
      const key = boardKey(b);
      if (!byKey.has(key)){
        byKey.set(key, { a: b.side1, b: b.side2, aKey: nameKey(b.side1), rank: b.board, games: [], wins: { a: 0, b: 0 } });
      }
    }
  }
  for (const gt of gameTurns){
    for (const b of gt.matches){
      if (b.phantom) continue;
      const p = byKey.get(boardKey(b));
      // Orient this board's scores onto the canonical A/B set by name overlap.
      const sameAsA = (b.side1 || []).some((s) => p.aKey.split("|").includes(s.toLowerCase()));
      const sa = sameAsA ? b.score1 : b.score2;
      const sb = sameAsA ? b.score2 : b.score1;
      const finished = b.finished;
      const winner = finished ? (sa > sb ? 1 : sb > sa ? 2 : 0) : 0;
      p.games[gt.game - 1] = { a: sa, b: sb, finished, live: !finished, winner };
      if (winner === 1) p.wins.a++;
      else if (winner === 2) p.wins.b++;
    }
  }

  const need = Math.floor(games / 2) + 1;   // game-wins needed to take the series
  const pairings = [...byKey.values()].sort((x, y) => x.rank - y.rank).map((p) => {
    const gs = [];
    for (let i = 0; i < games; i++) gs.push(p.games[i] || { pending: true });
    const winnerSide = p.wins.a >= need ? "a" : p.wins.b >= need ? "b" : null;
    return { a: p.a, b: p.b, rank: p.rank, games: gs, wins: p.wins, decided: !!winnerSide, winnerSide };
  });

  return {
    kindLabel: rank.final.kindLabel, games, need, firstTurn,
    currentGame: Math.min(games, rank.currentTurn - firstTurn + 1),
    pairings,
  };
}

/* ============================================================================
   5) buildCorridor — the parsed pieces into the single corridor data shape.
   ============================================================================ */
function buildCorridor(rank, matches, clock){
  const headers = (rank.headers || []).map((h) => String(h).toLowerCase().replace(/[^a-z0-9]/g, ""));
  const colOf = (...ns) => { for (const n of ns){ const i = headers.indexOf(n); if (i !== -1) return i; } return -1; };
  const ptsI = colOf("pts", "points", "score");
  const bchI = colOf("bch", "byes", "bye", "buchholz");
  const netI = colOf("net", "spread", "diff");
  const type = rank.type || "singles";
  const splitNames = (name) =>
    type === "doubles"
      ? String(name || "").split(/\s+and\s+|\s*\/\s*|\s*&\s*/i).map((s) => s.trim()).filter(Boolean)
      : [name];

  const standings = (rank.standings || []).map((s) => ({
    rank: s.rank, players: splitNames(s.player),
    pts: numFrom(s.cells, ptsI), bch: numFrom(s.cells, bchI), net: numFrom(s.cells, netI),
  }));

  let effectiveClock = rank.prized ? null : clock || null;

  if (effectiveClock && effectiveClock.mode === "ready"){
    const anyScored = (matches || []).some((m) => !m.phantom && (m.finished || m.score1 !== 0 || m.score2 !== 0));
    if (anyScored) effectiveClock = { ...effectiveClock, mode: "over" };
  }

  // First-round / between-round detection: when no clock is up but the tourney page carries a
  // "Preparing…" (pre_countdown) link, label it as preparing. We can't show a live timer — the
  // pre_countdown page has no server anchor and its duration lives only in that link's URL.
  const state = rank.prized
    ? "final"
    : effectiveClock
      ? effectiveClock.mode
      : rank.preCountdown
        ? "prepare"
        : rank.currentTurn
          ? "idle"
          : "pre";

  return {
    event: {
      name: rank.tournament || "Tournament", type,
      currentRound: rank.currentTurn, totalRounds: rank.totalRounds != null ? rank.totalRounds : null,
      location: rank.details?.location || "", club: rank.details?.club || "", system: rank.details?.system || "",
    },
    clock: effectiveClock, matches: matches || [], standings, state, updatedISO: new Date().toISOString(),
  };
}
function numFrom(cells, i){
  if (i < 0 || !cells) return "";
  const v = cells[i];
  const n = parseFloat(String(v).replace(",", "."));
  return Number.isFinite(n) ? n : v != null ? v : "";
}

/* ============================================================================
   6) POLL LOOP — fetch the lit page (solving Anubis if the gate is up), read the
   current turn, the boards and the countdown, then adapt + render. All in-page.
   ============================================================================ */
let learnedId = null; // { url, id } — cached per target URL, survives between rounds
let polling = false;

function withTurn(base, turn){
  const u = new URL(base);
  u.searchParams.set("turn", turn);
  u.searchParams.set("_", Date.now()); // cache-buster: scores change within a round
  return u.href;
}

/* Resolve the hosting club's emblem — one extra fetch, once per tournament.

   SoL names two clubs on a tourney: "Club" (owns the championship) and "Hosted by"
   (runs the event). The emblem printed on the tourney page is the championship
   owner's, NOT the organiser's, so prefer the "Hosted by" club's own page, fall back
   to the "Club" page, and only then to the tourney page's own emblem. Each club page
   carries <img id="emblem" src="/lit/emblem/<hash>.<ext>" title="<club name>">.

   Best-effort throughout: any failure just leaves the bundled board icon. Successes
   are persisted; a miss is remembered for the session only, so a transient error
   doesn't disable the emblem until someone clears storage. */
async function clubEmblem(href){
  const u = new URL(href, CONFIG.targetUrl).href;
  const r = await fetchTarget(u);
  if (!r.ok || r.anubis) return null;
  const doc = new DOMParser().parseFromString(r.html, "text/html");
  const img = doc.querySelector("#emblem, #club_emblem img");
  const src = img && img.getAttribute("src");
  if (!src) return null;
  return { src: new URL(src, u).href, title: cleanText(img.getAttribute("title")) };
}

async function resolveEmblem(rank){
  if (CONFIG.hostLogoUrl) return;                              // manual override wins
  if (EMBLEM.url === CONFIG.targetUrl && EMBLEM.tried) return; // already settled this tournament
  const e = rank.emblem || {};
  // The championship owner's emblem is the one already printed on the tourney page, so
  // it costs nothing; only the organiser needs the extra club-page fetch.
  let owner = e.pageSrc ? { src: new URL(e.pageSrc, CONFIG.targetUrl).href, title: e.pageTitle || "" } : null;
  let host = null;
  if (e.hostedByHref){
    try { host = await clubEmblem(e.hostedByHref); } catch (err) { console.warn("[emblem] host club failed:", err); }
  }
  if (!owner && e.clubHref){
    try { owner = await clubEmblem(e.clubHref); } catch (err) { console.warn("[emblem] owner club failed:", err); }
  }
  if (!host && !owner && e.hostedByName){
    console.warn("[emblem] no emblem found for", e.hostedByName);
  }
  EMBLEM = { url: CONFIG.targetUrl, host, owner, tried: true,
             hostName: e.hostedByName || "", ownerName: e.clubName || "" };
  if (host || owner){
    try { localStorage.setItem(EMBLEM_KEY, JSON.stringify(EMBLEM)); } catch (err) {}
  }
  applyLogo();
  syncEmblemUI();   // refresh the settings panel's labels if it's open
}

async function poll(){
  if (polling) return;
  polling = true;
  try {
    if (!CONFIG.targetUrl || /REPLACE_WITH_TOURNEY_GUID/.test(CONFIG.targetUrl)){
      showUrlPrompt();
      return;
    }

    // 1) Ranking / meta page. Auto-solves Anubis if needed.
    const res = await fetchWithSolve(CONFIG.targetUrl);
    if (res.anubis){
      if (!everRendered) showEmpty({ state: "anubis", message: "Anubis challenge — retrying…" });
      applyStatus({ state: "anubis", message: "Anubis — reconnecting…" });
      return;
    }
    if (!res.ok) throw new Error("HTTP " + res.httpStatus);

    const rank = parseTourney(res.html);
    if (rank.status === "anubis"){
      if (!everRendered) showEmpty({ state: "anubis", message: "Anubis challenge — retrying…" });
      applyStatus({ state: "anubis", message: "Anubis — reconnecting…" });
      return;
    }

    // idtourney resolution: fresh page id → per-URL learned cache → manual config.
    const manual = CONFIG.idtourney && String(CONFIG.idtourney).trim();
    const learnedForThis = learnedId && learnedId.url === CONFIG.targetUrl ? learnedId.id : null;
    const idt = rank.idtourney || learnedForThis || manual || null;
    if (rank.idtourney && (!learnedId || learnedId.id !== rank.idtourney || learnedId.url !== CONFIG.targetUrl)){
      learnedId = { url: CONFIG.targetUrl, id: rank.idtourney };
    }

    // 2) Current turn's boards (live matches). Best-effort; never blocks the poll.
    let matches = [];
    if (rank.currentTurn != null){
      try {
        const tr = await fetchTarget(withTurn(CONFIG.targetUrl, rank.currentTurn));
        if (tr.ok && !tr.anubis) matches = parseMatches(tr.html);
      } catch (e) { console.warn("[turn] fetch/parse failed:", e); }
    }

    // 2b) Finals: a best-of-N final spans several turns (one per game). Fetch every
    // final turn that exists so far (firstTurn..currentTurn) and assemble the series;
    // future games render as "pending". Shown even once the tourney is prized — a decided
    // final is exactly what we want on screen (with the winner marked), not a bare ranking.
    let finals = null;
    if (rank.final && rank.final.firstTurn != null && rank.currentTurn != null &&
        rank.currentTurn >= rank.final.firstTurn){
      const lastTurn = Math.min(rank.currentTurn, rank.final.firstTurn + rank.final.games - 1);
      const gameTurns = [];
      for (let t = rank.final.firstTurn; t <= lastTurn; t++){
        let boards = [];
        if (t === rank.currentTurn){
          boards = matches;   // already fetched above
        } else {
          try {
            const tr = await fetchTarget(withTurn(CONFIG.targetUrl, t));
            if (tr.ok && !tr.anubis) boards = parseMatches(tr.html);
          } catch (e) { console.warn("[final turn " + t + "] fetch/parse failed:", e); }
        }
        gameTurns.push({ turn: t, game: t - rank.final.firstTurn + 1, matches: boards });
      }
      if (gameTurns.some((g) => g.matches.length)) finals = buildFinals(rank, gameTurns);
    }

    // 3) Countdown / timer. The running-round clock (/tourney/countdown). Skipped during
    // the final — final matches usually have no time limit, and any clock isn't meaningful,
    // so we hide the timer bar there (no clock → buildCorridor yields no timer, state "idle").
    let clock = null;
    if (idt && !finals){
      try {
        const cdU = new URL("/tourney/countdown", CONFIG.targetUrl);
        cdU.searchParams.set("idtourney", idt);
        cdU.searchParams.set("_", Date.now()); // cache-buster: same URL every round
        const cd = await fetchTarget(cdU.href);
        if (cd.ok && !cd.anubis) clock = parseCountdown(cd.html);
      } catch (e) { console.warn("[countdown] fetch/parse failed:", e); }
    }

    // 4) Assemble + render.
    const data = buildCorridor(rank, matches, clock);
    data.finals = finals;
    data.sourceUrl = CONFIG.targetUrl;
    data.idtourney = idt;
    if (TOTAL_ROUNDS) data.event.totalRounds = TOTAL_ROUNDS;
    start(data);

    // After the board is up: the emblem costs a fetch and must never delay the render.
    resolveEmblem(rank).catch((e) => console.warn("[emblem] resolve failed:", e));
  } catch (e) {
    console.error("[poll] failed:", e);
    // Keep the last good board on screen; only blank out if we never rendered.
    if (!everRendered) showEmpty({ state: "error", message: String(e.message || e) });
    applyStatus({ state: "error", message: String(e.message || e) });
  } finally {
    polling = false;
  }
}

/* ============================================================================
   7) RENDER / TICK / AUTOSCROLL — ported from dashboard/dashboard.js.
   ============================================================================ */
const LABELS = {
  round: "Round", remaining: "remaining", liveMatches: "Live matches", standings: "Standings", players: "Players",
  running: "In progress", prealarm: "No more new boards", time: "Round ended",
  nextRound: "Next round", prealarmIn: "prealarm in", nextRoundAt: "next round ~",
  updated: "updated", finished: "Finished", inProgress: "In progress", bye: "Bye",
  pts: "Pts", bch: "Bch", net: "Net", page: "page", source: "source",
  afterRound: "after round",
  connLive: "Live", connConnecting: "Connecting", connOffline: "Offline",
};

const SCROLL_SPEED = 28;      // px/sec vertical drift
const SCROLL_PAUSE_MS = 2000; // pause at top and bottom
const SCROLL_FRAME_MS = 50;   // ~20fps cap; drift is slow so fewer frames look identical, ~1/3 less GPU
const SCROLL_MANUAL_MS = 10000; // hold the auto drift after a manual scroll, so it doesn't yank the view back
/* Total rounds. SoL never publishes a target round count for Swiss events, so this is
   operator-set: click the "Round n / N" label. Persisted per tournament URL so a
   previous tournament's count can't leak into a new one; ?rounds= / CONFIG is the
   launch-time default, null hides the "/ N" part. */
const ROUNDS_KEY = "solDash.totalRounds";
let TOTAL_ROUNDS = CONFIG.totalRounds || null;
try {
  const st = JSON.parse(localStorage.getItem(ROUNDS_KEY) || "null");
  if (st && st.url === CONFIG.targetUrl) TOTAL_ROUNDS = st.n;
} catch (e) {}

const BREAK_KEY = "solDash.breakMin";
let BREAK_MIN = 10;           // assumed break between rounds for the "next round ~" estimate
try { BREAK_MIN = Math.max(0, Number(localStorage.getItem(BREAK_KEY))) || BREAK_MIN; } catch (e) {}

/* Screen zoom (hover-only control in the footer). The browser's own zoom steps
   (67/75/80/90/100/110…) are too coarse for dialling in a corridor screen, and no API
   can drive it from the page — so we scale the rem base instead, which the whole layout
   is built on. The px width thresholds below (MATCH_MIN_COL / STAND_MIN_COL /
   STAND_PANEL_REM's rem→px conversion) and the autoscroll speed are scaled by the same
   factor, so columns re-flow and rows drift exactly as under real browser zoom. */
const ZOOM_KEY = "solDash.zoom";
const ZOOM_BASE_PX = 20;      // must match html{font-size:20px}
const ZOOM_STEP = 0.05, ZOOM_MIN = 0.5, ZOOM_MAX = 2;
let ZOOM = 1;
function clampZoom(z){
  if (!Number.isFinite(z) || z <= 0) return 1;
  return Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, Math.round(z * 100) / 100));
}
function applyZoom(){
  document.documentElement.style.fontSize = (ZOOM_BASE_PX * ZOOM).toFixed(2) + "px";
  const pct = document.getElementById("zoomPct");
  if (pct) pct.textContent = Math.round(ZOOM * 100) + "%";
}
function setZoom(z){
  const next = clampZoom(z);
  if (next !== ZOOM){
    ZOOM = next;
    try { localStorage.setItem(ZOOM_KEY, String(ZOOM)); } catch (e) {}
    applyZoom();
    syncZoomReadout();   // the settings panel's own readout, when it's open
    // Column counts are width-driven, so a zoom change has to re-flow both panels.
    if (everRendered && DATA){ renderMatches(); renderStandings(); layoutPanels(); }
  }
}
try { ZOOM = clampZoom(Number(localStorage.getItem(ZOOM_KEY))); } catch (e) {}
applyZoom();

/* Next-round estimate. auto = this round's end + BREAK_MIN (computed from the running
   clock and remembered after it ends); manual = operator override set by clicking the
   header time (lunch breaks). Both survive until a NEW clock starts. */
const NEXT_KEY = "solDash.nextRound";
let NEXT = { roundISO: null, endMs: null, manual: null };
try {
  NEXT = Object.assign(NEXT, JSON.parse(localStorage.getItem(NEXT_KEY) || "{}"));
  // drop leftovers from a previous tournament day
  if (NEXT.savedMs && Date.now() - NEXT.savedMs > 6 * 3600000) NEXT = { roundISO: null, endMs: null, manual: null };
} catch (e) {}
function saveNext(){ NEXT.savedMs = Date.now(); try { localStorage.setItem(NEXT_KEY, JSON.stringify(NEXT)); } catch (e) {} }

function renderNextRound(){
  const aux = document.getElementById("clockAux");
  // No "next round" during the final results or while the final is being played — its
  // games are consecutive turns of the same match, not rounds with a break between them.
  if (!DATA || DATA.state === "final" || DATA.finals){ aux.innerHTML = ""; return; }
  let inner = "";
  if (NEXT.manual) inner = "<b>" + esc(NEXT.manual) + "</b>";
  else if (NEXT.endMs) inner = "<b>~" + hhmm(round5(new Date(NEXT.endMs + BREAK_MIN * 60000))) + "</b>";
  else if (DATA.event.name) inner = "<b>—</b>";
  aux.innerHTML = inner ? '<span class="nrlabel">' + LABELS.nextRound + "</span>" + inner : "";
}

let DATA = null;
let clockTimer = null;
let everRendered = false;

// QR code to the live SoL page, floating bottom-right. Auto-hidden from round
// 3 on (&qr=1 forces it on, &qr=0 forces it off); click it to dismiss early.
let qrHidden = false;
function renderQR(){
  const box = document.getElementById("qrBox");
  if (!box) return;
  const round = DATA && DATA.event ? DATA.event.currentRound : null;
  const pastRound2 = round != null && round > 2;
  const autoShow = CONFIG.qrForceOff ? false : (CONFIG.qrForceOn ? true : !pastRound2);
  const show = !!(CONFIG.targetUrl && CONFIG.targetUrl.trim()) && autoShow && !qrHidden;
  box.classList.toggle("show", show);
  if (!show || box.dataset.renderedFor === CONFIG.targetUrl) return;
  try {
    const qr = qrcode(0, "M");
    qr.addData(CONFIG.targetUrl);
    qr.make();
    document.getElementById("qrImg").innerHTML = qr.createSvgTag({ scalable: true, margin: 2 });
    box.dataset.renderedFor = CONFIG.targetUrl;
  } catch (e) {
    console.warn("[qr] render failed:", e);
    qrHidden = true;
    box.classList.remove("show");
  }
}
document.getElementById("qrBox").addEventListener("click", () => {
  qrHidden = true;
  renderQR();
  syncQRCheckbox();     // keep the settings panel's toggle honest
});
renderQR();

function pad(n){ return String(n).padStart(2, "0"); }
function mmss(sec){ sec = Math.max(0, Math.round(sec)); return pad(Math.floor(sec / 60)) + ":" + pad(sec % 60); }
function hhmm(d){ return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function round5(d){ const ms = 5 * 60 * 1000; return new Date(Math.round(d.getTime() / ms) * ms); }
function esc(s){ return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
function fmtName(full){
  const s = String(full || "").trim();
  if (!s) return "";
  const i = s.indexOf(" ");
  if (i < 0) return '<b class="sn">' + esc(s) + "</b>";
  return '<b class="sn">' + esc(s.slice(0, i)) + "</b> " + esc(s.slice(i + 1));
}
function names(side){
  return '<span class="names">' + (side || []).map(fmtName).join('<span class="vs">/</span>') + "</span>";
}

function start(data){
  DATA = data;
  everRendered = true;
  renderStatic();
  renderMatches();
  renderStandings();
  layoutPanels();
  refreshFooter();
  renderQR();

  if (clockTimer){ clearInterval(clockTimer); clockTimer = null; }
  const bar = document.getElementById("timerbar");
  if (DATA.clock){
    bar.style.display = "";
    if (!DATA.clock.mode) DATA.clock.mode = "running";
    tick();
    clockTimer = setInterval(tick, 1000);
  } else {
    bar.style.display = "none";
    renderNextRound();     // keep the "next round ~" estimate up between timers
  }
  // Rendering real data IS the live signal, so the renderer owns it rather than its
  // caller — which also keeps the mock-driven screenshots honest for free.
  applyStatus({ state: "ok", message: "" });
}

/* Auto-scroll a panel body: drift the .scroller down at SCROLL_SPEED, pause at the
   bottom, drift back up, pause at the top, repeat. The rows move via a GPU-composited
   transform (no per-frame scroll repaint); the panel header stays fixed outside .scroller.
   Time-based, so it's independent of frame rate, and it re-queries .scroller every tick so
   innerHTML re-renders don't disturb the loop. */
function attachAutoScroll(el){
  if (!el) return;
  let pos = 0, dir = 1, pauseUntil = 0, last = null, inner = null, written = null;
  let manualUntil = 0;

  /* Manual scrolling. The rows are moved by a transform rather than scrollTop, so .sclip
     is overflow:hidden and the wheel would do nothing at all — hence driving `pos` by hand
     here instead of making the panel natively scrollable, which would give up the
     GPU-composited path. A wheel notch also holds the automatic drift off for a while, so
     the two can't fight over the same offset while someone is reading. */
  const nudge = (cur, delta) => {
    const max = cur.offsetHeight - cur.parentNode.clientHeight;
    if (max <= 1) return false;
    pos = Math.min(max, Math.max(0, pos + delta));
    const next = Math.round(pos);
    if (next !== written){ cur.style.transform = "translateY(" + (-next) + "px)"; written = next; }
    inner = cur;
    dir = 1;                                   // resume downward, wherever they left it
    manualUntil = performance.now() + SCROLL_MANUAL_MS;
    return true;
  };

  el.addEventListener("wheel", (e) => {
    const cur = el.querySelector(".scroller");
    if (cur && nudge(cur, e.deltaY)) e.preventDefault();
  }, { passive: false });

  // Touch drag, for venue screens that happen to be touchscreens.
  let touchY = null;
  el.addEventListener("touchstart", (e) => { touchY = e.touches[0].clientY; }, { passive: true });
  el.addEventListener("touchmove", (e) => {
    if (touchY == null) return;
    const y = e.touches[0].clientY;
    const cur = el.querySelector(".scroller");
    if (cur && nudge(cur, touchY - y)) e.preventDefault();
    touchY = y;
  }, { passive: false });
  el.addEventListener("touchend", () => { touchY = null; }, { passive: true });

  function frame(ts){
    requestAnimationFrame(frame);
    const cur = el.querySelector(".scroller");
    if (!cur){ last = null; return; }                    // nothing rendered yet
    if (cur !== inner){ inner = cur; written = null; }    // re-rendered: reapply transform
    const clip = inner.parentNode;
    if (last == null){ last = ts; return; }
    const dt = ts - last;
    if (dt < SCROLL_FRAME_MS) return;                     // throttle below the display refresh rate
    last = ts;
    const max = inner.offsetHeight - clip.clientHeight;
    if (max <= 1){ if (written !== 0){ inner.style.transform = "translateY(0)"; written = 0; } pos = 0; dir = 1; pauseUntil = 0; return; }
    if (pos > max) pos = max;
    if (ts < pauseUntil || ts < manualUntil) return;   // held off while someone is scrolling by hand
    pos += dir * SCROLL_SPEED * ZOOM * (dt / 1000);   // taller rows when zoomed in → same perceived speed
    if (pos >= max){ pos = max; dir = -1; pauseUntil = ts + SCROLL_PAUSE_MS; }
    else if (pos <= 0){ pos = 0; dir = 1; pauseUntil = ts + SCROLL_PAUSE_MS; }
    const next = Math.round(pos);
    if (next !== written){ inner.style.transform = "translateY(" + (-next) + "px)"; written = next; }  // skip redundant frames
  }
  requestAnimationFrame(frame);
}

function topStatus(d){
  const r = d.event.currentRound, tot = d.event.totalRounds;
  const rnd = r == null ? "" : (tot != null ? "Round " + r + " / " + tot : "Round " + r);
  if (d.finals){
    // No clock during the final, so read progress from the games themselves.
    const anyLive = d.finals.pairings.some((p) => p.games.some((g) => g.live));
    const allDecided = d.finals.pairings.length > 0 && d.finals.pairings.every((p) => p.decided);
    const suffix = allDecided ? " · decided" : anyLive ? " · in progress" : "";
    return "Final · game " + d.finals.currentGame + " of " + d.finals.games + suffix;
  }
  switch (d.state){
    case "final":    return "Final results";
    case "running":  return rnd + " · in progress";
    case "prealarm": return rnd + " · prealarm";
    case "over":     return rnd + " · round ended";
    case "ready":    return rnd + " · prepared";
    case "prepare":  return r != null ? "Preparing round " + r : "Preparing the first round";
    case "pre":      return "Before first round";
    default:         return rnd || "In progress";
  }
}

function renderStatic(){
  const e = DATA.event;
  document.getElementById("eventName").textContent = e.name || "SoL Live";
  document.getElementById("eventSub").textContent = topStatus(DATA);
  document.getElementById("matchesTitle").textContent = LABELS.liveMatches;
  document.title = (e.name || "SoL Live") + " — Corridor Dashboard";
}

/* ---------- Message bar (operator announcement; edited in the settings panel) ---------- */
const MSG_KEY = "solDash.message";
let MSG = "";
try { MSG = localStorage.getItem(MSG_KEY) || ""; } catch (e) {}

function renderMessage(){
  const bar = document.getElementById("messageBar");
  const msg = MSG.trim();
  bar.textContent = msg;
  bar.classList.toggle("on", !!msg);
}
function setMessage(v){
  MSG = v;
  try { localStorage.setItem(MSG_KEY, v); } catch (e) {}
  renderMessage();
}
/* ---------- Settings panel (click the logo / its hover gear) ----------
   Opened in a DETACHED window where the browser allows one, so the operator can drag it
   onto a laptop screen and edit without the audience reading half-typed announcements off
   the projector. Falls back to an in-page overlay when the popup is blocked.

   Both hosts are fed from <template id="settingsTpl">, so there is one copy of the markup;
   every DOM lookup goes through the host document, never the global `document`.
   This is the single editor for every operator setting: the logo, the Space key, the clock's
   next-round block and the "Round n / N" subtitle all open it. */
let setWin = null;   // the detached window, while it is open

// The document currently hosting the settings form, or null when it's closed.
function settingsHost(){
  if (setWin && !setWin.closed && setWin.document) return setWin.document;
  const ov = document.getElementById("settingsOverlay");
  return ov && ov.classList.contains("on") ? document : null;
}

function mountSettings(doc, root){
  root.appendChild(doc.importNode(document.getElementById("settingsTpl").content, true));
  const $ = (id) => doc.getElementById(id);
  $("setMsg").value = MSG;
  /* Deliberately NOT pre-filled with the automatic estimate: this field is a manual
     override, so pre-filling it would freeze the current estimate the moment anyone
     pressed Apply after editing some unrelated field. Empty = stay automatic; the
     estimate is shown in the hint instead, where it can't be committed by accident. */
  $("setNext").value = NEXT.manual || "";
  const auto = NEXT.endMs ? hhmm(round5(new Date(NEXT.endMs + BREAK_MIN * 60000))) : null;
  $("setNextHint").textContent = auto
    ? "Empty = automatic estimate, currently ~" + auto + " (round end + break)."
    : "Empty = automatic estimate (round end + break).";
  $("setBreak").value = BREAK_MIN;
  $("setRounds").value = TOTAL_ROUNDS || "";
  $("setQr").checked = document.getElementById("qrBox").classList.contains("show");
  $("setEmblem").value = EMBLEM_MODE;
  // Zoom and the QR toggle are direct manipulations — they apply on the spot, so the
  // operator can watch the big screen while nudging them. Text fields wait for Apply.
  $("setZoomOut").addEventListener("click", () => setZoom(ZOOM - ZOOM_STEP));
  $("setZoomIn").addEventListener("click", () => setZoom(ZOOM + ZOOM_STEP));
  $("setColsOut").addEventListener("click", () => adjustCols(-1));
  $("setColsIn").addEventListener("click", () => adjustCols(1));
  $("setColsPct").addEventListener("click", () => setColsOverride(null));
  $("setQr").addEventListener("change", (e) => setQRVisible(e.target.checked));
  $("setEmblem").addEventListener("change", (e) => { setEmblemMode(e.target.value); syncEmblemUI(); });
  syncEmblemUI();
  $("setApply").addEventListener("click", applySettings);
  $("setClose").addEventListener("click", closeSettings);
  syncZoomReadout();
  syncColsReadout();
  $("setMsg").focus();
}

function syncZoomReadout(){
  const doc = settingsHost();
  const out = doc && doc.getElementById("setZoomPct");
  if (out) out.textContent = Math.round(ZOOM * 100) + "%";
}

function syncColsReadout(){
  const doc = settingsHost();
  const out = doc && doc.getElementById("setColsPct");
  if (out) out.textContent = COLS_OVERRIDE != null ? String(COLS_OVERRIDE) : "Auto";
}

// The QR auto-hides from round 3 on, so re-ticking the box after that has to force it
// back on — the same thing &qr=1 does — or renderQR would just hide it again.
function setQRVisible(on){
  qrHidden = !on;
  CONFIG.qrForceOn = !!on;
  CONFIG.qrForceOff = !on;
  renderQR();
}
/* Name the actual clubs in the dropdown once they're known — "Hosting club" and
   "Championship owner" mean nothing until you see that they're the Czech Carrom
   Association and the European Carrom Confederation. Re-run when resolution lands,
   since the panel may already be open by then. */
function syncEmblemUI(){
  const doc = settingsHost();
  const sel = doc && doc.getElementById("setEmblem");
  if (!sel) return;
  const label = (base, name, em) =>
    base + (name ? " — " + name : "") + (em ? "" : " (no emblem)");
  sel.options[0].textContent = label("Hosting club", EMBLEM.hostName, EMBLEM.host);
  sel.options[1].textContent = label("Championship owner", EMBLEM.ownerName, EMBLEM.owner);
  sel.value = EMBLEM_MODE;

  const hint = doc.getElementById("setEmblemHint");
  if (!hint) return;
  const shown = emblemPick();
  if (CONFIG.hostLogoUrl) hint.textContent = "Overridden by &logo= in the launch URL.";
  else if (EMBLEM_MODE === "off") hint.textContent = "Using the bundled board icon.";
  else if (!shown) hint.textContent = EMBLEM.tried
    ? "No emblem published on SoL for either club."
    : "Looking up the club emblem…";
  else if (EMBLEM_MODE === "host" && !EMBLEM.host)
    hint.textContent = "The host club has no emblem — showing " + (shown.title || "the other club") + ".";
  else if (EMBLEM_MODE === "owner" && !EMBLEM.owner)
    hint.textContent = "The championship club has no emblem — showing " + (shown.title || "the other club") + ".";
  else hint.textContent = "Showing " + (shown.title || "the club emblem") + ".";
}

function syncQRCheckbox(){
  const doc = settingsHost();
  const box = doc && doc.getElementById("setQr");
  if (box) box.checked = document.getElementById("qrBox").classList.contains("show");
}

function applySettings(){
  const doc = settingsHost();
  if (!doc) return;
  const $ = (id) => doc.getElementById(id);
  setMessage($("setMsg").value);

  const brk = Number($("setBreak").value);
  if (Number.isFinite(brk) && brk >= 0){
    BREAK_MIN = brk;
    try { localStorage.setItem(BREAK_KEY, String(brk)); } catch (e) {}
  }
  // Empty = fall back to the automatic estimate, the same as the editor's "Auto time".
  NEXT.manual = $("setNext").value || null;
  saveNext();
  renderNextRound();

  const n = Math.round(Number($("setRounds").value));
  TOTAL_ROUNDS = (Number.isFinite(n) && n >= 1) ? n : null;
  try { localStorage.setItem(ROUNDS_KEY, JSON.stringify({ url: CONFIG.targetUrl, n: TOTAL_ROUNDS })); } catch (e) {}
  if (DATA){ DATA.event.totalRounds = TOTAL_ROUNDS; document.getElementById("eventSub").textContent = topStatus(DATA); }

  // Confirm in the panel itself — on a detached window the operator may not be looking
  // at the big screen, and an unmarked Apply gives no sign it landed.
  const note = $("setNote");
  if (note){
    note.classList.add("on");
    clearTimeout(applySettings._t);
    applySettings._t = setTimeout(() => note.classList.remove("on"), 1600);
  }
}

/* Grow the detached window until the form fits, so it never opens with a scrollbar.
   The window's outer size includes the browser's own chrome, whose height varies by
   platform and theme, so measure the shortfall against inner* rather than guessing a
   constant. Runs after a tick to let the popup lay out first, and never exceeds the
   screen. */
function fitSettingsWindow(w){
  w.setTimeout(() => {
    if (w.closed) return;
    const b = w.document.body;
    const needW = b.scrollWidth - w.innerWidth;
    const needH = b.scrollHeight - w.innerHeight;
    if (needW <= 0 && needH <= 0) return;
    w.resizeTo(Math.min(w.screen.availWidth,  w.outerWidth  + Math.max(0, needW)),
               Math.min(w.screen.availHeight, w.outerHeight + Math.max(0, needH)));
  }, 0);
}

function openSettings(){
  if (setWin && !setWin.closed){ setWin.focus(); return; }
  let w = null;
  try { w = window.open("", "solSettings", "popup=yes,width=560,height=700"); } catch (e) {}
  if (w && w.document){
    setWin = w;
    w.document.open();
    w.document.write('<!doctype html><html><head><meta charset="utf-8">' +
      "<title>Dashboard settings</title><style>html,body{margin:0}body{padding:14px;background:#eef2f7}" +
      document.getElementById("setCss").textContent + "</style></head><body></body></html>");
    w.document.close();
    mountSettings(w.document, w.document.body);
    w.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSettings(); });
    fitSettingsWindow(w);
    w.focus();
  } else {
    const ov = document.getElementById("settingsOverlay");
    ov.innerHTML = "";
    ov.classList.add("on");
    mountSettings(document, ov);
  }
}

function closeSettings(){
  if (setWin && !setWin.closed) setWin.close();
  setWin = null;
  const ov = document.getElementById("settingsOverlay");
  ov.classList.remove("on");
  ov.innerHTML = "";
}

/* Content-driven column sizing, tuned against the longest expected names at the 1.35rem
   font cap: singles "WEERAWARNAKULA Haritha" = 368px, doubles "BANKOVIC Aleksandar/
   PAVLOVIC Aleksandar" = 596px (longer pairs may ellipsize). Values include the rank/
   board/score/badge cells, paddings and grid gaps around the name. */
const STAND_MIN_COL = { singles: 520, doubles: 760 };      // players list (no matches): rank+name column
const MATCH_MIN_COL = { singles: 600, doubles: 850 };      // matches: board+names+score+badge column
const STAND_PANEL_REM = { singles: 33.5, doubles: 45.5 };  // standings beside matches (rank+name+pts/bch/net)

function eventType(){ return DATA && DATA.event.type === "doubles" ? "doubles" : "singles"; }

// Standings are hidden while round 1 is still in play — until its results are all in,
// the ranking would only echo the seeding order.
function showStandings(){
  const list = DATA.matches || [];
  if (!list.length) return true;                    // pre-round player list
  if (DATA.event.currentRound !== 1) return true;
  return list.every((m) => m.finished || m.phantom);
}

// As many match columns as fit beside the standings (5 singles / 3 doubles at 4K),
// but no more than one column per ~6 boards so small rounds don't over-spread.
function autoMatchColumns(n){
  const t = eventType();
  const avail = window.innerWidth - (showStandings() ? STAND_PANEL_REM[t] * ZOOM_BASE_PX * ZOOM : 0); // minus the standings panel
  return Math.max(1, Math.min(Math.ceil(n / 6), Math.floor(avail / (MATCH_MIN_COL[t] * ZOOM))));
}
function matchColumns(n){
  return COLS_OVERRIDE != null ? Math.max(1, COLS_OVERRIDE) : autoMatchColumns(n);
}

/* Manual column override ([ / ] to step it, \ to reset to automatic). Content-driven
   auto-fit (above/below) is what most screens want, but an operator watching the actual
   projector sometimes wants fewer, wider columns for readability or more, narrower ones to
   fit more boards at a glance — overriding what the width math picked. Applies to whichever
   grid is currently on screen (match columns, or the pre-round player-list columns), not
   the finals panel, which is always a single fixed column. */
const COLS_KEY = "solDash.cols";
const COLS_MIN = 1, COLS_MAX = 10;
let COLS_OVERRIDE = null;
try {
  const v = localStorage.getItem(COLS_KEY);
  if (v !== null){
    const n = Math.round(Number(v));
    if (Number.isFinite(n) && n >= COLS_MIN && n <= COLS_MAX) COLS_OVERRIDE = n;
  }
} catch (e) {}
function currentColsBase(){
  if (!DATA) return 1;
  const list = DATA.matches || [];
  return list.length > 0 ? autoMatchColumns(list.length) : autoStandingsCols((DATA.standings || []).length);
}
function setColsOverride(next){
  const clamped = next == null ? null : Math.max(COLS_MIN, Math.min(COLS_MAX, Math.round(next)));
  if (clamped === COLS_OVERRIDE) return;
  COLS_OVERRIDE = clamped;
  try {
    if (COLS_OVERRIDE == null) localStorage.removeItem(COLS_KEY);
    else localStorage.setItem(COLS_KEY, String(COLS_OVERRIDE));
  } catch (e) {}
  syncColsReadout();   // the settings panel's own readout, when it's open
  // Column counts drive both grids' markup, not just their CSS widths, so re-render.
  if (everRendered && DATA){ renderMatches(); renderStandings(); layoutPanels(); }
}
function adjustCols(delta){
  setColsOverride((COLS_OVERRIDE != null ? COLS_OVERRIDE : currentColsBase()) + delta);
}

function layoutPanels(){
  const list = DATA.matches || [];
  const isFinals = !!DATA.finals;
  const hasMatches = isFinals || list.length > 0;
  const m = document.getElementById("matchesPanel");
  const s = document.getElementById("standingsPanel");
  const main = document.querySelector("main");
  const showS = showStandings();
  s.style.display = showS ? "" : "none";
  m.style.display = hasMatches ? "" : "none";
  if (isFinals){
    // The finals panel is a single fixed-layout column; give standings its usual share.
    main.style.gridTemplateColumns = showS ? ("1fr " + STAND_PANEL_REM[eventType()] + "rem") : "1fr";
  } else {
    const cols = matchColumns(list.length);
    main.style.gridTemplateColumns = hasMatches && showS ? (cols + "fr " + STAND_PANEL_REM[eventType()] + "rem") : "1fr";
  }
}

function renderMatches(){
  if (DATA.finals){ renderFinals(); return; }
  const list = DATA.matches || [];
  const body = document.getElementById("matchesBody");
  const teamLabel = DATA.event.type === "doubles" ? "Team" : "Player";
  const headCell = '<div class="match head">' +
      '<div class="board">Board</div>' +
      '<div class="sides"><div class="side"><span class="names">' + teamLabel + "</span>" +
        '<span class="sc">Score</span></div></div>' +
      '<div class="badges"></div>' +
    "</div>";
  const cols = matchColumns(list.length);
  const rows = Math.ceil(list.length / cols) || 1;
  const colHtml = [];
  for (let c = 0; c < cols; c++){
    const slice = list.slice(c * rows, (c + 1) * rows);
    colHtml.push('<div class="mcol">' + slice.map(renderMatchRow).join("") + "</div>");
  }
  const gt = "grid-template-columns:repeat(" + cols + ",1fr)";
  body.innerHTML = '<div class="mhead" style="' + gt + '">' + headCell.repeat(cols) + "</div>" +
    '<div class="sclip"><div class="scroller">' +
      '<div class="mgrid" style="' + gt + '">' + colHtml.join("") + "</div>" +
    "</div></div>";
  const remaining = list.filter((m) => !m.finished && !m.phantom).length;
  document.getElementById("matchesPg").textContent = remaining + " " + LABELS.remaining;
}

function renderMatchRow(m){
  const s1win = m.finished && m.winner === 1, s2win = m.finished && m.winner === 2;
  const started = DATA.state === "running";
  let badge;
  if (m.phantom) badge = '<span class="badge bye" title="' + LABELS.bye + '">—</span>';
  else if (m.finished) badge = '<span class="badge fin" title="' + LABELS.finished + '">✓</span>';
  else if (started) badge = '<span class="badge live" title="' + LABELS.inProgress + '"><span class="statedot"></span></span>';
  else badge = '<span class="badge sched">&nbsp;</span>';
  return "" +
    '<div class="match">' +
      '<div class="board">B' + m.board + "</div>" +
      '<div class="sides">' +
        '<div class="side' + (s1win ? " win" : "") + '">' + names(m.side1) + '<span class="sc">' + m.score1 + "</span></div>" +
        '<div class="side' + (s2win ? " win" : "") + '">' + names(m.side2) + '<span class="sc">' + m.score2 + "</span></div>" +
      "</div>" +
      '<div class="badges">' + badge + "</div>" +
    "</div>";
}

// Ordinal for placement labels: 1 -> "1st", 2 -> "2nd", 3 -> "3rd", 4 -> "4th", …
function ordinal(n){
  const s = ["th", "st", "nd", "rd"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}
// A pairing's contested places from its board rank: rank 1 -> "1st / 2nd place", 2 -> "3rd / 4th place".
function placementLabel(rank){
  const hi = rank * 2 - 1;
  return ordinal(hi) + " / " + ordinal(hi + 1) + " place";
}

// Finals panel: for each pairing (usually just 1st/2nd) show the two sides, the series
// score (games won), and a card per game — the played ones with their board score, the
// live game pulsing, and not-yet-played games dimmed as "pending".
function renderFinals(){
  const f = DATA.finals;
  document.getElementById("matchesTitle").textContent = "Final";
  document.getElementById("matchesPg").textContent = f.kindLabel;
  const html = f.pairings.map((p, i) => renderFinalPairing(p, f, i === 0)).join("");
  document.getElementById("matchesBody").innerHTML = '<div class="finals">' + html + "</div>";
}

function renderFinalPairing(p, f, top){
  const aWon = p.winnerSide === "a", bWon = p.winnerSide === "b";
  const gamesHtml = p.games.map((g, i) => {
    if (g.pending) return '<div class="fgame pending"><div class="fgl">Game ' + (i + 1) + "</div><div class=\"fgs\">—</div></div>";
    const cls = "fgame " + (g.live ? "live" : "done") +
      (g.finished && g.winner === 1 ? " awin" : g.finished && g.winner === 2 ? " bwin" : "");
    const label = (g.live ? '<span class="statedot"></span>' : "") + "Game " + (i + 1);
    return '<div class="' + cls + '"><div class="fgl">' + label + "</div>" +
      '<div class="fgs"><span class="a">' + g.a + '</span><span class="sep">–</span><span class="b">' + g.b + "</span></div></div>";
  }).join("");
  // Only label the contested places when there are several finals (1st/2nd, 3rd/4th, …);
  // with a single final the "1st / 2nd place" tag is redundant.
  const rankLabel = f.pairings.length > 1 ? '<div class="frank">' + placementLabel(p.rank) + "</div>" : "";
  return '<div class="final-match' + (top ? " top" : "") + (p.decided ? " decided" : "") + '">' +
      rankLabel +
      '<div class="fteams">' +
        '<div class="fteam' + (aWon ? " win" : "") + '">' + names(p.a) + (aWon ? '<span class="crown">🏆</span>' : "") + "</div>" +
        '<div class="fseries"><span class="' + (aWon ? "win" : "") + '">' + p.wins.a + '</span><span class="dash">–</span><span class="' + (bWon ? "win" : "") + '">' + p.wins.b + "</span></div>" +
        '<div class="fteam' + (bWon ? " win" : "") + '">' + names(p.b) + (bWon ? '<span class="crown">🏆</span>' : "") + "</div>" +
      "</div>" +
      '<div class="fgames">' + gamesHtml + "</div>" +
    "</div>";
}

// How many standings columns fit — driven by viewport WIDTH (not player count), so a wide
// screen uses more columns. Capped so a column never gets absurdly short.
// Column width per event type (see STAND_MIN_COL): ~7 singles / ~5 doubles columns at 4K.
function autoStandingsCols(n){
  const byWidth = Math.floor(window.innerWidth / (STAND_MIN_COL[eventType()] * ZOOM));
  // Only split off another column once each would still hold >=10 rows — avoid
  // slicing a tiny field (e.g. 5 pairs) into skimpy columns.
  return Math.max(1, Math.min(byWidth, Math.floor(n / 10)));
}
function standingsCols(n){
  return COLS_OVERRIDE != null ? Math.max(1, COLS_OVERRIDE) : autoStandingsCols(n);
}

function renderStandings(){
  const list = DATA.standings || [];
  const hasMatches = (DATA.matches || []).length > 0;
  const body = document.getElementById("standingsBody");
  document.getElementById("standingsTitle").textContent = hasMatches ? LABELS.standings : LABELS.players;
  // "after round N": N = the round whose results the ranking already includes — the
  // current round once all its boards are final, otherwise the previous one.
  let roundMark = "";
  const curRound = DATA.event.currentRound;
  if (hasMatches && curRound != null){
    const allDone = (DATA.matches || []).every((m) => m.finished || m.phantom);
    const after = allDone ? curRound : curRound - 1;
    if (after >= 1) roundMark = LABELS.afterRound + " " + after;
  }
  document.getElementById("standingsRound").textContent = roundMark;
  const teamLabel = DATA.event.type === "doubles" ? "Team" : "Player";
  const rcell = (r) => '<td class="r"><span class="' + (r.rank <= 3 ? "rankchip r" + r.rank : "rankchip") + '">' + r.rank + "</span></td>";
  const single = (cg, thead, rows) =>
    '<table class="rank rank-head">' + cg + thead + "</table>" +
    '<div class="sclip"><div class="scroller">' +
      '<table class="rank rank-body">' + cg + "<tbody>" + rows + "</tbody></table>" +
    "</div></div>";

  if (hasMatches){
    // Beside matches: full standings (pts/bch/net), single column.
    const cg = '<colgroup><col class="cg-r"><col class="cg-name"><col class="cg-pts"><col class="cg-num"><col class="cg-num"></colgroup>';
    const thead = "<thead><tr>" +
      '<th class="r">#</th><th class="name">' + teamLabel + "</th>" +
      "<th>" + LABELS.pts + "</th><th>" + LABELS.bch + "</th><th>" + LABELS.net + "</th></tr></thead>";
    const rowHtml = (r) => "<tr>" + rcell(r) +
      '<td class="name">' + names(r.players) + "</td>" +
      '<td class="pts">' + r.pts + "</td><td class=\"num\">" + r.bch + '</td><td class="num">' + r.net + "</td></tr>";
    body.innerHTML = single(cg, thead, list.map(rowHtml).join(""));
  } else {
    // No matches (e.g. before the first round): a plain player list — name only, no pts/bch/net —
    // spread column-major across as many columns as the viewport fits.
    const K = standingsCols(list.length);
    const cg = '<colgroup><col class="cg-r"><col class="cg-name"></colgroup>';
    const thead = '<thead><tr><th class="r">#</th><th class="name">' + teamLabel + "</th></tr></thead>";
    const rowHtml = (r) => "<tr>" + rcell(r) + '<td class="name">' + names(r.players) + "</td></tr>";
    if (K <= 1){
      body.innerHTML = single(cg, thead, list.map(rowHtml).join(""));
    } else {
      const per = Math.ceil(list.length / K) || 1;
      const heads = [], bodies = [];
      for (let c = 0; c < K; c++){
        const slice = list.slice(c * per, (c + 1) * per);
        heads.push('<table class="rank rank-head">' + cg + thead + "</table>");
        bodies.push('<table class="rank rank-body">' + cg + "<tbody>" + slice.map(rowHtml).join("") + "</tbody></table>");
      }
      const gt = "grid-template-columns:repeat(" + K + ",1fr)";
      body.innerHTML =
        '<div class="scol-head" style="' + gt + '">' + heads.join("") + "</div>" +
        '<div class="sclip"><div class="scroller">' +
          '<div class="scol-grid" style="' + gt + '">' + bodies.join("") + "</div>" +
        "</div></div>";
    }
  }
  document.getElementById("standingsPg").textContent =
    list.length + (DATA.event.type === "doubles" ? " teams" : " players");
}

function tick(){
  const c = DATA.clock;
  const bar = document.getElementById("timerbar");
  const tEl = document.getElementById("clockTime");
  const sEl = document.getElementById("clockState");
  const aux = document.getElementById("clockAux");
  bar.classList.remove("state-running", "state-prealarm", "state-time", "state-next", "state-ended", "state-alldone");

  // Remember this round's end for the "next round ~" estimate. It survives past the
  // round's end; a NEW clock (startedAt far from the remembered one — the ISO drifts
  // ±1s per poll) resets it and clears any manual override.
  if (c.startedAtISO){
    const startMs = new Date(c.startedAtISO).getTime();
    const endMs = startMs + c.durationMin * 60000;
    const prevMs = NEXT.roundISO ? new Date(NEXT.roundISO).getTime() : null;
    if (prevMs == null || Math.abs(startMs - prevMs) > 5 * 60000){
      NEXT = { roundISO: c.startedAtISO, endMs: endMs, manual: null };
      saveNext();
    } else if (Math.abs((NEXT.endMs || 0) - endMs) > 60000){
      NEXT.endMs = endMs;
      saveNext();
    }
  }
  renderNextRound();

  if (c.mode === "ready"){
    bar.classList.add("state-next");
    tEl.textContent = mmss((c.durationMin || 0) * 60);
    sEl.textContent = "Round prepared";
    return;
  }

  if (c.mode === "over"){
    bar.classList.add("state-ended");
    tEl.textContent = "00:00";
    sEl.textContent = LABELS.time;
    return;
  }

  // Every board already final while the clock still runs — blink the timer
  // so it's obvious the round can be ended early.
  const boards = DATA.matches || [];
  if (boards.length && boards.every((m) => m.finished || m.phantom)) bar.classList.add("state-alldone");

  const started = new Date(c.startedAtISO).getTime();
  const durSec = c.durationMin * 60, preSec = c.prealarmMin * 60;
  const remaining = durSec - (Date.now() - started) / 1000;

  if (remaining > preSec){
    bar.classList.add("state-running");
    tEl.textContent = mmss(remaining);
    sEl.textContent = LABELS.running;
  } else if (remaining > 0){
    bar.classList.add("state-prealarm");
    tEl.textContent = mmss(remaining);
    sEl.innerHTML = '<span class="statedot"></span>' + LABELS.prealarm;
  } else {
    bar.classList.add("state-ended");
    tEl.textContent = "00:00";
    sEl.textContent = LABELS.time;
  }
}

function refreshFooter(){
  const el = document.getElementById("updated");
  if (!DATA || !DATA.updatedISO){ el.textContent = ""; return; }
  el.textContent = LABELS.updated + " " + hhmm(new Date(DATA.updatedISO));
}

/* Footer connection badge, keyed by the same status everything else in the footer uses.
   "waiting" is the pre-first-poll default, so a page that never reaches SoL keeps saying
   Connecting rather than Live. "unconfigured" hides it: with the URL prompt up there is
   no tournament to be connected to, and an amber "connecting" would be equally untrue. */
const CONN_STATES = {
  ok:           { cls: "ok",   text: LABELS.connLive },
  anubis:       { cls: "warn", text: LABELS.connConnecting },
  waiting:      { cls: "warn", text: LABELS.connConnecting },
  error:        { cls: "err",  text: LABELS.connOffline },
  unconfigured: { cls: "off",  text: LABELS.connConnecting },
};
/* Seeded to match the markup, and only written when it actually changes: a poll lands
   every minute, and rewriting the badge each time would restart the dot's blink — the
   pulse would visibly hiccup on every poll. The dot element is never replaced for the
   same reason, so its animation runs uninterrupted. */
let connState = "waiting";

function applyStatus(status){
  const state = (status && status.state) || "waiting";
  const note = document.getElementById("dashstatus");
  if (note){
    if (state === "anubis") note.textContent = "⚠ " + (status.message || "Anubis — reconnecting…");
    else if (state === "error") note.textContent = "⚠ " + (status.message || "error");
    else note.textContent = "";
  }
  const badge = document.getElementById("connbadge");
  const text = document.getElementById("conntext");
  if (badge && text && state !== connState){
    const s = CONN_STATES[state] || CONN_STATES.waiting;
    connState = state;
    badge.className = "live " + s.cls;
    text.textContent = s.text;
  }
}

// Small helper to surface solve progress in the footer without blanking the board.
function logStatus(msg){ applyStatus({ state: "anubis", message: msg }); }

function showEmpty(status){
  DATA = { event: { name: "", type: "singles", currentRound: null, totalRounds: null, location: "", club: "", system: "" },
           clock: null, matches: [], standings: [], state: "idle", updatedISO: null };
  renderMatches();
  renderStandings();
  layoutPanels();
  document.getElementById("timerbar").style.display = "none";
  document.getElementById("clockAux").innerHTML = "";
  const anubis = status && status.state === "anubis";
  document.getElementById("eventName").textContent = anubis ? "Reconnecting to SoL…" : "Waiting for SoL…";
  document.getElementById("eventSub").textContent = anubis
    ? (status.message || "Re-solving the Anubis challenge…")
    : (status && status.state === "error" ? String(status.message || "") : "");
  document.title = "SoL Live Dashboard";
  refreshFooter();
  applyStatus(status);
  renderQR();
}

/* Startup prompt: with no tournament configured there is nothing to poll, so ask for
   the URL on screen instead of pointing at CONFIG in a console-style message. The
   input's type=url gives native "enter a URL" validation; submitting reloads with
   ?url= set and every other query param kept, exactly as if it had been typed —
   which also makes the result bookmarkable. */
function showUrlPrompt(){
  showEmpty({ state: "unconfigured" });
  document.getElementById("eventName").textContent = "SoL Live Dashboard";
  const p = document.getElementById("urlPrompt");
  if (!p.classList.contains("on")){
    p.classList.add("on");
    document.getElementById("urlInput").focus();
  }
}
document.getElementById("urlForm").addEventListener("submit", e => {
  e.preventDefault();
  const q = new URLSearchParams(location.search);
  q.set("url", document.getElementById("urlInput").value.trim());
  location.search = q.toString();
});

   8) BOOT
   ============================================================================ */
showEmpty({}); // "Waiting for SoL…"
attachAutoScroll(document.getElementById("matchesBody"));
attachAutoScroll(document.getElementById("standingsBody"));

renderMessage();
document.getElementById("logoBtn").addEventListener("click", openSettings);
document.getElementById("settingsOverlay").addEventListener("click", e => { if (e.target.id === "settingsOverlay") closeSettings(); });
addEventListener("beforeunload", () => { if (setWin && !setWin.closed) setWin.close(); });
// The clock's next-round block and the "Round n / N" subtitle stay clickable, now as
// shortcuts straight into the settings panel that holds those fields.
document.getElementById("clockAux").addEventListener("click", openSettings);
document.getElementById("eventSub").addEventListener("click", openSettings);
document.getElementById("zoomOut").addEventListener("click", () => setZoom(ZOOM - ZOOM_STEP));
document.getElementById("zoomIn").addEventListener("click", () => setZoom(ZOOM + ZOOM_STEP));
document.getElementById("zoomPct").addEventListener("click", () => setZoom(1));
/* Keyboard: Space opens the settings panel, Escape closes it, bare +/-/0 mirror the
   footer zoom buttons, and [ / ] / \ step or reset the manual column override. Ctrl/Cmd
   combos are left alone so the browser's own zoom still works, and keys are ignored while
   a form field has focus so they can be typed. */
addEventListener("keydown", e => {
  if (e.key === "Escape"){ closeSettings(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = e.target && e.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  if (e.key === " " || e.key === "Spacebar"){
    if (tag === "BUTTON") return;          // Space is that button's own activation key
    e.preventDefault();                    // ...and not a page scroll
    openSettings();
  }
  else if (e.key === "+" || e.key === "=") setZoom(ZOOM + ZOOM_STEP);
  else if (e.key === "-" || e.key === "_") setZoom(ZOOM - ZOOM_STEP);
  else if (e.key === "0") setZoom(1);
  else if (e.key === "[") adjustCols(-1);
  else if (e.key === "]") adjustCols(1);
  else if (e.key === "\\") setColsOverride(null);
});
poll();
setInterval(poll, Math.max(30, CONFIG.pollSeconds) * 1000);

// Re-flow the width-driven columns (players list, match columns) when the viewport changes.
let _resizeT = null;
addEventListener("resize", () => {
  clearTimeout(_resizeT);
  _resizeT = setTimeout(() => {
    if (everRendered && DATA){ renderMatches(); renderStandings(); layoutPanels(); }
  }, 200);
});
</script>
